<body>
<script>
/* 香港节点：B74 实时对话服务（独立模块，不改播放链） */
window.__B74_BASE_PATH = "https://suomalianjia.cn/b74";
window.__B74_WS_URL = "wss://suomalianjia.cn/b74/ws/doubao";
/* 同源注册表：B74 的 /api/characters 不带 CORS 头，跨域 fetch 会被浏览器拦掉，
   导致 state.characters 为空、__b74SelectCharacter 永远失败、对话恒显示默认考拉。
   改为读取与本页同源的角色表副本，彻底不依赖 CORS。 */
window.__B74_REGISTRY_URL = "./characters.v1.json";
window.__B74_CSS_URL = "https://suomalianjia.cn/b74/candidate.css?v=12";
</script>
<script>
(function(){var l=document.createElement('link');l.rel='stylesheet';l.href=window.__B74_CSS_URL;document.head.appendChild(l);})();
</script>
<script type="module">
import "./b74-candidate.js?v=20261007-fix-a1";
const params = new URLSearchParams(location.search);
const requestedCharacter = params.get("character") || "yunqi-koala";
const requestedEmotion = params.get("emotion") || "";
const apply = () => { try { window.__b74SelectCharacter?.(requestedCharacter); window.__b74SetMood?.(requestedEmotion); } catch (e) {} };
if (window.__b74Ready && typeof window.__b74Ready.then === "function") { window.__b74Ready.then(apply); }
else { apply(); }
</script>
