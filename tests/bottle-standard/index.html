<!doctype html>
<html lang="zh-CN">
<head>
<base href="../../">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="apple-touch-icon" href="assets/icons/app-icon-v2-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="泸沽湖·爱与文明">
<title>泸沽湖·心域</title>
<link rel="icon" href="assets/icons/favicon-v2-64.png" type="image/png">
<style>
* {
box-sizing: border-box;
}

html,
body {
width: 100%;
height: 100%;
margin: 0;
overflow: hidden;
}

body {
display: grid;
place-items: center;
min-height: 100svh;
background-color: #020407;
background-image:
radial-gradient(circle at 50% 12%, rgba(82, 129, 189, .18), rgba(2, 4, 7, 0) 34%),
url("space-bg.webp");
background-position: center center;
background-size: cover;
background-repeat: no-repeat;
}

.phone-stage {
--stage-width: min(100vw, 430px);
--stage-height: 100svh;
position: relative;
isolation: isolate;
width: var(--stage-width);
height: var(--stage-height);
max-height: 100dvh;
overflow: hidden;
background-color: #000;
background-image: url("space-bg.webp");
background-position: center center;
background-size: cover;
background-repeat: no-repeat;
box-shadow: 0 0 90px rgba(57, 109, 172, .18);
transform: translateZ(0);
}

.star-field {
position: fixed;
inset: 0;
z-index: 0;
pointer-events: none;
}

.place-mark {
position: fixed;
top: max(14px, env(safe-area-inset-top));
left: max(14px, env(safe-area-inset-left));
z-index: 6;
display: inline-flex;
align-items: center;
gap: 10px;
min-height: 44px;
max-width: calc(var(--stage-width) - 28px);
padding: 2px 4px 2px 0;
border-radius: 999px;
color: rgba(255, 244, 214, .78);
font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
font-size: clamp(13px, 3.6vw, 16px);
font-weight: 300;
line-height: 1.55;
letter-spacing: .08em;
text-decoration: none;
text-shadow: 0 0 12px rgba(255, 236, 184, .45);
transition: filter .24s ease, text-shadow .24s ease, transform .24s ease;
}

.place-mark:hover,
.place-mark:focus-visible,
.place-mark:active {
filter: drop-shadow(0 0 9px rgba(237, 196, 99, .5));
text-shadow: 0 0 16px rgba(255, 236, 184, .72);
outline: none;
}

.place-mark:active {
transform: scale(.98);
}

/* A single opening glimmer acknowledges that the logo is an entrance, without
   turning it into a constantly demanding button. */
.place-mark {
animation: place-mark-awaken 3.4s ease 1.3s both;
}

.place-mark-logo {
display: block;
width: 34px;
height: 34px;
flex: 0 0 34px;
transform-origin: center;
filter: drop-shadow(0 0 4px rgba(255, 222, 143, .48));
animation: lugu-logo-breathe 2.8s ease-in-out infinite;
}

.place-mark-text {
display: block;
}

.place-mark span {
display: block;
font-size: .72em;
letter-spacing: .16em;
color: rgba(255, 255, 255, .62);
}

.android-entry {
position: fixed;
top: max(60px, calc(env(safe-area-inset-top, 0px) + 60px));
right: max(14px, env(safe-area-inset-right));
z-index: 6;
display: inline-flex;
align-items: center;
min-height: 40px;
padding: 0 13px;
border-radius: 999px;
color: rgba(255, 244, 214, .85);
font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
font-size: clamp(12px, 3.2vw, 14px);
font-weight: 400;
letter-spacing: .04em;
text-decoration: none;
background: rgba(20, 22, 40, .35);
border: 1px solid rgba(255, 255, 255, .14);
backdrop-filter: blur(6px);
-webkit-backdrop-filter: blur(6px);
text-shadow: 0 0 10px rgba(255, 236, 184, .35);
transition: filter .24s ease, transform .24s ease;
}
.android-entry:hover,
.android-entry:focus-visible,
.android-entry:active {
filter: drop-shadow(0 0 8px rgba(237, 196, 99, .45));
outline: none;
}
.android-entry:active {
transform: scale(.97);
}

.star {
position: absolute;
top: var(--y);
left: var(--x);
width: var(--size);
height: var(--size);
border-radius: 50%;
color: var(--color);
background: currentColor;
animation: breathe-star 4s ease-in-out var(--delay) infinite;
will-change: opacity, transform, filter;
}

.voice-star-layer {
position: fixed;
inset: 0;
z-index: 2;
pointer-events: none;
overflow: hidden;
}

.heart-star-layer {
position: fixed;
inset: 0;
z-index: 3;
pointer-events: none;
overflow: hidden;
}

.voice-star {
position: absolute;
left: 0;
top: 0;
width: var(--voice-size);
height: var(--voice-size);
padding: 0;
border: 0;
background: transparent;
opacity: 0;
transform: translate3d(var(--voice-x), var(--voice-y), 0) scale(.18);
transform-origin: center;
pointer-events: auto;
cursor: pointer;
will-change: transform, opacity, filter;
}

.voice-star::before {
content: "";
position: absolute;
inset: -150%;
border-radius: 50%;
background: radial-gradient(circle, var(--voice-glow) 0%, var(--voice-haze) 28%, rgba(255, 255, 255, 0) 70%);
opacity: .76;
filter: blur(2.5px);
}

.voice-star::after {
content: "";
position: absolute;
inset: 12%;
border-radius: 50%;
background: radial-gradient(circle, #fff 0 18%, var(--voice-core) 44%, rgba(255, 255, 255, 0) 76%);
box-shadow: 0 0 16px var(--voice-core), 0 0 26px var(--voice-glow);
opacity: 1;
}

.voice-star-shape {
position: absolute;
inset: -8%;
border-radius: 34%;
background:
radial-gradient(circle at 50% 50%, #fff 0 11%, var(--voice-core) 19%, rgba(255, 255, 255, 0) 40%),
linear-gradient(135deg, rgba(255, 255, 255, .96), var(--voice-color) 46%, var(--voice-deep) 100%);
clip-path: polygon(50% 0, 56% 41%, 100% 50%, 56% 59%, 50% 100%, 44% 59%, 0 50%, 44% 41%);
filter: drop-shadow(0 0 9px var(--voice-core)) drop-shadow(0 0 24px var(--voice-glow));
}

.launched-heart-star {
--heart-star-color: #ffd76a;
--heart-star-core: #fff8dc;
--heart-star-glow: rgba(255, 211, 104, .76);
--heart-star-size: 34px;
position: absolute;
left: var(--heart-star-x, 70%);
top: var(--heart-star-y, 22%);
width: var(--heart-star-size);
height: var(--heart-star-size);
padding: 0;
border: 0;
background: transparent;
opacity: .96;
transform: translate(-50%, -50%);
pointer-events: auto;
cursor: pointer;
filter: drop-shadow(0 0 16px var(--heart-star-glow)) drop-shadow(0 0 38px var(--heart-star-glow));
animation: launched-heart-float 5.2s ease-in-out infinite, launched-heart-twinkle var(--heart-star-speed, 2.5s) ease-in-out infinite;
}

.launched-heart-star::before {
content: "";
position: absolute;
inset: 0;
background:
radial-gradient(circle at 50% 50%, var(--heart-star-core) 0 12%, var(--heart-star-color) 23%, transparent 48%),
linear-gradient(135deg, rgba(255, 255, 255, .92), var(--heart-star-color) 48%, rgba(255, 255, 255, .18));
clip-path: polygon(50% 0, 59% 38%, 100% 50%, 59% 62%, 50% 100%, 41% 62%, 0 50%, 41% 38%);
}

.launched-heart-star::after {
content: "";
position: absolute;
inset: -82%;
border-radius: 50%;
background: radial-gradient(circle, var(--heart-star-glow), rgba(255, 255, 255, 0) 64%);
opacity: .72;
}

.launched-heart-star.shape-shine::before {
clip-path: polygon(50% 0, 61% 34%, 96% 16%, 66% 48%, 100% 50%, 66% 52%, 96% 84%, 61% 66%, 50% 100%, 39% 66%, 4% 84%, 34% 52%, 0 50%, 34% 48%, 4% 16%, 39% 34%);
}

.launched-heart-star.shape-meteor::before {
clip-path: polygon(36% 0, 48% 34%, 100% 8%, 62% 48%, 82% 100%, 45% 66%, 0 90%, 31% 53%);
}

.launched-heart-star.shape-nebula::before {
border-radius: 42% 58% 48% 52%;
clip-path: none;
}

.launched-heart-star.shape-nebula::after {
inset: -120%;
background:
radial-gradient(circle at 30% 42%, var(--heart-star-glow), transparent 34%),
radial-gradient(circle at 70% 58%, rgba(255, 255, 255, .34), transparent 32%);
filter: blur(3px);
}

.launched-heart-star.shape-crystal::before {
clip-path: polygon(50% 0, 78% 20%, 100% 50%, 76% 82%, 50% 100%, 24% 82%, 0 50%, 22% 20%);
}

.launched-heart-star.shape-petal::before {
border-radius: 50% 8% 50% 8%;
clip-path: polygon(50% 0, 64% 34%, 100% 18%, 72% 50%, 100% 82%, 64% 66%, 50% 100%, 36% 66%, 0 82%, 28% 50%, 0 18%, 36% 34%);
}

.launched-heart-label {
position: absolute;
left: 50%;
top: calc(100% + 10px);
min-width: 46px;
padding: 4px 8px;
border: 1px solid rgba(255, 244, 212, .3);
border-radius: 999px;
background: rgba(8, 11, 24, .56);
color: rgba(255, 244, 212, .92);
font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
font-size: 10px;
letter-spacing: .12em;
white-space: nowrap;
transform: translateX(-50%);
backdrop-filter: blur(10px);
}

.heart-star-card {
position: fixed;
left: 50%;
bottom: max(28px, env(safe-area-inset-bottom));
z-index: 9;
width: min(calc(var(--stage-width) - 32px), 386px);
padding: 18px;
border: 1px solid rgba(255, 255, 255, .18);
border-radius: 18px;
background:
radial-gradient(circle at 22% 0, rgba(255, 222, 148, .2), transparent 34%),
rgba(12, 15, 30, .86);
box-shadow: 0 22px 70px rgba(0, 0, 0, .44), inset 0 0 26px rgba(255, 255, 255, .05);
backdrop-filter: blur(22px);
color: #fff;
font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
text-align: left;
opacity: 0;
visibility: hidden;
transform: translate(-50%, 18px) scale(.98);
transition: opacity .28s ease, visibility .28s ease, transform .28s ease;
}

.heart-star-card.is-visible {
opacity: 1;
visibility: visible;
transform: translate(-50%, 0) scale(1);
}

.heart-star-card-close {
position: absolute;
right: 12px;
top: 12px;
width: 34px;
height: 34px;
border: 1px solid rgba(255, 255, 255, .2);
border-radius: 50%;
background: rgba(255, 255, 255, .08);
color: #fff;
font-size: 22px;
line-height: 1;
cursor: pointer;
}

.heart-star-card-no {
margin: 0 38px 8px 0;
color: rgba(255, 242, 210, .96);
font-size: 17px;
font-weight: 700;
letter-spacing: .04em;
}

.heart-star-card-name {
margin: 0 0 10px;
font-size: 15px;
font-weight: 650;
}

.heart-star-card-voice {
margin: 0 0 15px;
color: rgba(236, 247, 255, .8);
font-size: 14px;
line-height: 1.7;
}

.heart-star-card-link {
display: flex;
align-items: center;
justify-content: center;
min-height: 48px;
border-radius: 14px;
background: linear-gradient(135deg, #ff5d7f, #ffc857);
box-shadow: 0 12px 34px rgba(255, 154, 95, .22);
color: #fff;
font-size: 15px;
font-weight: 700;
letter-spacing: .04em;
text-decoration: none;
}

.voice-star.is-touched {
pointer-events: none;
filter: brightness(3.4) saturate(1.6);
animation: touched-star-flare 2s ease forwards;
}

.voice-star.is-touched::before {
inset: -180%;
background: radial-gradient(circle, var(--voice-glow) 0%, rgba(255, 255, 255, .3) 30%, rgba(255, 255, 255, 0) 70%);
opacity: 1;
filter: blur(1.5px) drop-shadow(0 0 18px var(--voice-glow));
animation: touched-star-halo 2s ease forwards;
}

.voice-star.is-touched::after {
inset: 4%;
box-shadow: 0 0 22px #fff, 0 0 42px var(--voice-glow), 0 0 70px var(--voice-color);
animation: touched-star-core 2s ease forwards;
}

.voice-star.is-touched .voice-star-shape {
animation: touched-star-shape 2s ease forwards;
}

@keyframes touched-star-flare {
0%,
100% {
opacity: 1;
}

35%,
68% {
opacity: .72;
}
}

@keyframes touched-star-halo {
0% {
opacity: .42;
transform: scale(.55);
}

35%,
72% {
opacity: .95;
transform: scale(1.08);
}

100% {
opacity: 0;
transform: scale(1.24);
}
}

@keyframes touched-star-core {
0% {
opacity: .72;
transform: scale(.8);
}

35%,
72% {
opacity: 1;
transform: scale(1.18);
}

100% {
opacity: .18;
transform: scale(.72);
}
}

@keyframes touched-star-shape {
0% {
filter: drop-shadow(0 0 9px var(--voice-core)) drop-shadow(0 0 24px var(--voice-glow));
transform: scale(1);
}

35%,
72% {
filter: drop-shadow(0 0 18px #fff) drop-shadow(0 0 42px var(--voice-glow));
transform: scale(1.35);
}

100% {
filter: drop-shadow(0 0 8px var(--voice-core));
transform: scale(.7);
}
}

.voice-bottle {
position: fixed;
left: 0;
top: 0;
z-index: 4;
width: min(74vw, 103px);
height: 130px;
color: rgba(91, 58, 28, .9);
font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
font-size: 13px;
letter-spacing: .04em;
text-align: center;
opacity: 0;
transform: translate3d(var(--bottle-x), calc(var(--bottle-y) - 12px), 0) rotate(-24deg) scale(.1);
pointer-events: auto;
animation: bottle-arrive var(--bottle-arrive) linear forwards;
filter: drop-shadow(0 0 18px rgba(118, 201, 255, .28)) drop-shadow(0 0 30px rgba(255, 205, 116, .46));
transform-origin: center center;
}

.voice-bottle-visual {
position: absolute;
inset: 0;
z-index: 0;
overflow: visible;
transform-origin: center center;
scale: 1;
translate: var(--bottle-zoom-x, 0px) var(--bottle-zoom-y, 0px);
transition:
scale 3s cubic-bezier(.2, .72, .2, 1),
translate 3s cubic-bezier(.2, .72, .2, 1);
}

.voice-bottle.zoom-level-2 .voice-bottle-visual {
scale: 2;
z-index: 7;
}

/* Once the rabbit leaves, the empty glass should not remain on screen. It
   reappears only for the last part of the return flight. */
.voice-bottle-visual > :not(.fengxin-rabbit-demo):not(.voice-bottle-rabbit-slot) {
transition: opacity 2.2s ease;
}

.voice-bottle.is-rabbit-releasing .voice-bottle-visual > :not(.fengxin-rabbit-demo):not(.voice-bottle-rabbit-slot),
.voice-bottle.is-final-bottle-hidden .voice-bottle-visual > :not(.fengxin-rabbit-demo):not(.voice-bottle-rabbit-slot) {
opacity: 0;
}

/* The narrative rabbit's exit has a short, deliberate glass dissolve rather
   than an abrupt disappearance. */
.voice-bottle.is-rabbit-emerging .voice-bottle-visual > :not(.fengxin-rabbit-demo):not(.voice-bottle-rabbit-slot) {
transition-duration: .48s;
}

.voice-bottle.rabbit-expanded .voice-letter-text {
opacity: 0 !important;
}

/* The card is permanently moved out of the rotating bottle once it has
   arrived, so its position no longer inherits bottle rotation or scaling. */
.voice-letter.is-floating-card {
position: absolute;
z-index: 10;
display: grid;
grid-template-columns: minmax(0, 1fr) auto;
column-gap: 16px;
row-gap: 8px;
width: min(calc(var(--stage-width) * .82), 352px);
min-height: 0;
padding: 10px;
opacity: .98;
overflow: visible;
transform: none;
animation: none;
border: 0;
border-radius: 16px;
background: transparent;
transition: left .55s cubic-bezier(.2, .72, .2, 1), top .55s cubic-bezier(.2, .72, .2, 1);
}

/* During the small-to-large bottle transition the card travels on the same
   calm tempo, so the enlarged bottle never covers its first lines. */
.voice-letter.is-floating-card.is-following-large-bottle {
transition: left 3s cubic-bezier(.2, .72, .2, 1), top 3s cubic-bezier(.2, .72, .2, 1);
}

.voice-letter.is-floating-card.is-following-rabbit-return {
transition: left 4.2s cubic-bezier(.18, .68, .18, 1), top 4.2s cubic-bezier(.18, .68, .18, 1);
}

.voice-letter.is-floating-card .voice-letter-text {
position: relative;
grid-column: 1 / -1;
left: 0;
top: auto;
width: 100%;
min-height: 0;
font-size: 17px;
line-height: 1.62;
letter-spacing: .035em;
transform: none;
opacity: 1 !important;
}

.voice-letter.is-floating-card .voice-letter-text span {
transform: none;
}

.voice-letter.is-floating-card .voice-letter-footer {
position: relative;
grid-column: 1 / -1;
grid-row: 2;
left: 0;
bottom: auto;
width: 100%;
gap: 2px;
font-size: 9px;
letter-spacing: .065em;
}
.voice-letter.is-floating-card .voice-letter-footer.is-visible {
opacity: .55;
}

.voice-letter.is-floating-card .voice-card-actions {
position: relative;
right: auto;
bottom: auto;
transform: none;
grid-column: 1 / -1;
grid-row: 3;
display: flex;
flex-direction: row;
justify-content: center;
align-items: center;
gap: 12px;
min-height: 28px;
margin-top: 16px;
}

.voice-letter.is-floating-card .voice-world-button {
position: relative;
align-self: center;
right: 0;
bottom: auto;
min-width: 104px;
height: 28px;
padding: 0 8px;
}

.voice-letter.is-floating-card .world-house-title {
font-size: 13px;
}
.voice-letter.is-floating-card .voice-send-button {
order: -1;
position: relative;
align-self: center;
right: 0;
bottom: auto;
margin-left: 0;
min-width: 104px;
height: 28px;
padding: 0 8px;
border-radius: 4px;
border: 1px solid rgba(255, 226, 158, .52);
background: linear-gradient(135deg, rgba(255, 242, 214, .30), rgba(191, 132, 88, .18) 48%, rgba(255, 209, 141, .22));
backdrop-filter: blur(16px) saturate(1.2);
-webkit-backdrop-filter: blur(16px) saturate(1.2);
box-shadow: 0 0 16px rgba(255, 176, 91, .18), inset 0 1px 0 rgba(255, 255, 255, .38), inset 0 0 12px rgba(255, 255, 255, .12);
color: rgba(255, 247, 228, .96);
font-size: 13px;
font-weight: 600;
letter-spacing: .04em;
line-height: 1;
white-space: nowrap;
}

.voice-letter.is-returned-to-bottle {
width: min(calc(var(--stage-width) * .76), 330px);
min-height: 218px;
opacity: .98;
transform: translateX(calc(-50% - 40px)) translateY(20px) rotate(var(--letter-tilt)) scale(.92);
animation: none;
}

.fengxin-rabbit-farewell-star {
position: fixed;
z-index: 61;
width: 8px;
height: 8px;
border-radius: 50%;
background: #fff8d5;
box-shadow: 0 0 8px rgba(255, 248, 213, .98), 0 0 20px rgba(151, 218, 255, .72), 0 0 36px rgba(151, 218, 255, .36);
pointer-events: none;
animation: rabbit-farewell-star 4.2s linear forwards;
}

@keyframes rabbit-farewell-star {
0% { opacity: 0; transform: translate(-50%, -50%) scale(.35); }
18% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
72% { opacity: .74; transform: translate(-50%, -50%) scale(.72); }
100% { opacity: 0; transform: translate(-50%, -50%) translateY(-18px) scale(.18); }
}

.voice-bottle.is-closing {
pointer-events: none;
}

.voice-bottle-farewell-star {
position: fixed;
z-index: 62;
width: 10px;
height: 10px;
clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
pointer-events: none;
background: #fff7ce;
box-shadow: 0 0 8px rgba(255, 248, 213, .98), 0 0 20px rgba(150, 218, 255, .7), 0 0 36px rgba(150, 218, 255, .32);
}

.voice-bottle-glass {
position: absolute;
left: 50%;
bottom: 54px;
z-index: 4;
width: 64px;
height: 97px;
border: 2px solid rgba(255, 244, 218, .76);
border-radius: 35px 35px 22px 22px / 43px 43px 20px 20px;
background:
linear-gradient(90deg, rgba(255, 255, 255, .34), rgba(255, 255, 255, .04) 20%, rgba(103, 195, 255, .18) 46%, rgba(255, 233, 190, .2) 78%, rgba(255, 255, 255, .28)),
radial-gradient(ellipse at 24% 16%, rgba(255, 255, 255, .72), rgba(255, 255, 255, 0) 30%),
radial-gradient(ellipse at 72% 68%, rgba(255, 255, 255, .2), rgba(255, 255, 255, 0) 36%),
radial-gradient(circle at 68% 88%, rgba(255, 188, 80, .48), rgba(255, 188, 80, 0) 34%);
box-shadow:
inset 0 0 24px rgba(255, 255, 255, .34),
inset 12px 0 16px rgba(255, 255, 255, .22),
inset -10px 0 14px rgba(80, 169, 255, .12),
0 0 24px rgba(125, 207, 255, .24),
0 0 28px rgba(255, 204, 117, .42);
transform: translateX(-50%);
}

.voice-bottle-glass::before {
content: "";
position: absolute;
left: 50%;
top: -26px;
width: 28px;
height: 33px;
border: 2px solid rgba(255, 244, 218, .76);
border-bottom: 0;
border-radius: 14px 14px 5px 5px;
background:
linear-gradient(90deg, rgba(255, 255, 255, .34), rgba(125, 193, 255, .12), rgba(255, 238, 202, .24)),
radial-gradient(ellipse at 28% 18%, rgba(255, 255, 255, .62), transparent 40%);
box-shadow: inset 0 0 16px rgba(255, 255, 255, .24), 0 0 20px rgba(255, 211, 132, .32);
transform: translateX(-50%);
}

.voice-bottle-glass::after {
content: "";
position: absolute;
left: 50%;
bottom: 5px;
width: 48px;
height: 12px;
border-radius: 50%;
border: 1px solid rgba(255, 236, 196, .52);
background: radial-gradient(ellipse, rgba(255, 238, 191, .5), rgba(255, 238, 191, 0) 68%);
/* Keep the reflection inside the bottle; no outer gold halo. */
box-shadow: inset 0 0 8px rgba(255, 255, 255, .28);
transform: translateX(-50%);
}

.voice-bottle-shine {
position: absolute;
left: 30px;
top: 3px;

/* Pre-shake only: right after the bottle arrives the static poster sits a
   touch high inside the bottle.  --rabbit-pre-shake-lift lowers ONLY that
   window; the class is removed when the wake shake starts, so the shake,
   playback and every later state keep their own tuned position. */
.fengxin-rabbit-demo.is-near.is-pre-shake {
transform: translateX(-50%) translateY(var(--rabbit-pre-shake-lift, 13px));
}

/* ---- Fixed in-bottle rabbit slot ----------------------------------------
   The rabbit's permanent home inside the bottle.  The slot is a child of
   .voice-bottle-visual, so the bottle's own translate / scale / rotate stack
   moves the rabbit automatically; the rabbit is never repositioned with
   hand-tuned per-stage top/px patches again.

   --rabbit-slot-top is the ONE scene anchor shared by every emotion
   (E04 / E13 both mount through this slot and nothing else differs in CSS).
   zoom-level-2 used to carry its own top patch; that patch is gone, so the
   rabbit scales rigidly with the glass instead of jumping at zoom start. */
.voice-bottle-rabbit-slot {
--rabbit-slot-top: -34px;
/* Only the freshly-arrived, not-yet-shaking static window is lowered by this
   amount; it is removed the moment the wake shake starts. */
--rabbit-pre-shake-lift: 13px;
position: absolute;
inset: 0;
z-index: 5;
pointer-events: none;
user-select: none;
overflow: visible;
}

.voice-bottle-rabbit-slot .fengxin-rabbit-demo {
top: var(--rabbit-slot-top, -34px);
}

pointer-events: auto;
transform: translateX(-50%);
filter: drop-shadow(0 0 18px rgba(255, 235, 174, .8)) drop-shadow(0 0 38px rgba(111, 200, 255, .48));
transition: width .45s cubic-bezier(.2, .72, .2, 1), height .45s cubic-bezier(.2, .72, .2, 1), top .45s cubic-bezier(.2, .72, .2, 1), opacity .3s ease;

if (previousFadingAudio && previousFadingAudio !== embeddedSpaceAudio && previousFadingAudio !== embeddedPreviewAudio) previousFadingAudio.pause();
if (typeof closeActiveVoiceExperience === "function") closeActiveVoiceExperience();

if (typeof window.stopMusic === "function") window.stopMusic({ immediate: true });

clearTimeout(embeddedSpaceStartTimer);

let shouldPlay = true;
try { shouldPlay = localStorage.getItem("lugu_space_music_enabled") !== "0"; } catch (error) {}

postToSpace(frame.contentWindow, { type: "lugu-space-music-state", playing: false });

window.addEventListener("message", (event) => {
const trustedOrigin = window.location.origin === "null" || event.origin === window.location.origin;
const trustedSource = !embeddedSpaceFrame || event.source === embeddedSpaceFrame.contentWindow;
if (!trustedOrigin || !trustedSource || !event.data) return;
if (event.data.type === "lugu-save-space-data" && event.data.data && event.data.data.created) {

try { localStorage.setItem("lugu_space_music_enabled", "0"); } catch (error) {}
return;
}
if (event.data.type === "lugu-preview-space-music" && event.data.src) {
stopEmbeddedPreview(false, event.source);
resumeSpaceAfterPreview = Boolean(embeddedSpaceAudio && !embeddedSpaceAudio.paused);
if (embeddedSpaceAudio) embeddedSpaceAudio.pause();
window.LuguMusic.claim("embedded-space");
embeddedPreviewAudio = new Audio(event.data.src);
const currentPreview = embeddedPreviewAudio;
embeddedPreviewAudio.volume = Number.isFinite(Number(event.data.volume)) ? Math.max(0, Math.min(1, Number(event.data.volume))) : .62;
embeddedPreviewAudio.addEventListener("ended", () => {
if (embeddedPreviewAudio !== currentPreview) return;
embeddedPreviewAudio = null;
postToSpace(event.source, { type: "lugu-preview-music-state", trackId: "", playing: false, ended: true });
if (resumeSpaceAfterPreview && embeddedSpaceAudio) embeddedSpaceAudio.play().catch(() => {});
resumeSpaceAfterPreview = false;
}, { once: true });
embeddedPreviewAudio.play().then(() => {
postToSpace(event.source, { type: "lugu-preview-music-state", trackId: event.data.trackId || "", playing: true });
}).catch(() => {
embeddedPreviewAudio = null;
postToSpace(event.source, { type: "lugu-preview-music-state", trackId: "", playing: false });
if (resumeSpaceAfterPreview && embeddedSpaceAudio) embeddedSpaceAudio.play().catch(() => {});
resumeSpaceAfterPreview = false;
});
}
if (event.data.type === "lugu-stop-preview-music") {
stopEmbeddedPreview(true, event.source);
}
if (event.data.type === "lugu-set-space-music" && event.data.src) {
stopEmbeddedPreview(false, event.source);
destroyEmbeddedAudio(embeddedSpaceAudio);
embeddedSpaceSource = event.data.src;
let shouldPlaySavedMusic = true;
try { shouldPlaySavedMusic = localStorage.getItem("lugu_space_music_enabled") !== "0"; } catch (error) {}
if (!shouldPlaySavedMusic) {
postToSpace(event.source, { type: "lugu-space-music-state", playing: false });
return;
}
embeddedSpaceAudio = new Audio(event.data.src);
embeddedSpaceAudio.volume = Number.isFinite(Number(event.data.volume)) ? Math.max(0, Math.min(1, Number(event.data.volume))) : .62;
embeddedSpaceAudio.loop = true;
embeddedSpaceAudio.play().catch(() => {});
postToSpace(event.source, { type: "lugu-space-music-state", playing: !embeddedSpaceAudio.paused });
}
if (event.data.type === "lugu-set-space-music-playing") {
clearTimeout(embeddedSpaceStartTimer);
stopEmbeddedPreview(false, event.source);
const shouldPlay = Boolean(event.data.playing);
if (!shouldPlay) {
stopAllSpaceAudio(event.source);
return;
}
if (shouldPlay) window.LuguMusic.claim("embedded-space");
if (!embeddedSpaceAudio && shouldPlay && embeddedSpaceSource) {
embeddedSpaceAudio = new Audio(embeddedSpaceSource);
embeddedSpaceAudio.volume = .62;
embeddedSpaceAudio.loop = true;
}
if (embeddedSpaceAudio) {
if (shouldPlay) embeddedSpaceAudio.play().catch(() => {});
else embeddedSpaceAudio.pause();
}
postToSpace(event.source, { type: "lugu-space-music-state", playing: Boolean(embeddedSpaceAudio && !embeddedSpaceAudio.paused) });
}
if (event.data.type === "lugu-set-space-music-volume") {
const nextSpaceVolume = Math.max(0, Math.min(1, Number(event.data.volume) || 0));
if (embeddedSpaceAudio) embeddedSpaceAudio.volume = nextSpaceVolume;
if (embeddedPreviewAudio) embeddedPreviewAudio.volume = nextSpaceVolume;

if (event.data.type === "lugu-toggle-space-music" && embeddedSpaceAudio) {
stopEmbeddedPreview(false, event.source);

else embeddedSpaceAudio.pause();

}

function randomLetterTilt() {
let tilt;

do {
const mode = Math.floor(Math.random() * 3);

if (mode === 0) {
tilt = Number(random(-10, -3).toFixed(1));
} else if (mode === 1) {
tilt = 0;
} else {
tilt = Number(random(3, 10).toFixed(1));
}
} while (tilt === lastLetterTilt);

lastLetterTilt = tilt;
return tilt;
}

function animateAudioVolume(audio, from, to, duration, onDone) {
const startTime = performance.now();
let frame = 0;

function fade(now) {
musicFadeFrames.delete(frame);
const progress = clamp((now - startTime) / duration, 0, 1);
const easedProgress = progress * progress * (3 - 2 * progress);
audio.volume = from + (to - from) * easedProgress;
if (progress < 1) {
frame = requestAnimationFrame(fade);
musicFadeFrames.add(frame);
return;
}
if (onDone) onDone();
}

frame = requestAnimationFrame(fade);
musicFadeFrames.add(frame);
}

function armBackgroundLoop(audio, session, forceAudible = false) {

if (!Number.isFinite(audio.duration) || audio.duration <= 0) return;

musicLoopTimer = setTimeout(() => crossfadeBackgroundLoop(audio, session, forceAudible), delay);

if (Number.isFinite(audio.duration) && audio.duration > 0) {
scheduleNext();
} else {
audio.addEventListener("loadedmetadata", scheduleNext, { once: true });
}
}

function playBackgroundTrack(session, fadeDuration = musicStartFadeDuration, forceAudible = musicForceAudible) {

activeMusicAudios.add(audio);

audio.addEventListener("ended", () => {

playBackgroundTrack(session, fadeDuration, forceAudible);
}

destroyAudioNow(audio);
syncMusicMotion();
if (window.syncAudioUI) window.syncAudioUI();
}, { once: true });

audio.play().then(() => {

animateAudioVolume(audio, 0, musicVolume, fadeDuration);
armBackgroundLoop(audio, session, forceAudible);

}).catch(() => {
destroyAudioNow(audio);
syncMusicMotion();
});
}

function crossfadeBackgroundLoop(currentAudio, session, forceAudible = musicForceAudible) {
if (session !== musicSession || !activeMusicAudios.has(currentAudio)) return;
if (backgroundMusicPlayCount >= backgroundMusicMaxPlays) return;
backgroundMusicPlayCount += 1;

const nextAudio = new Audio(backgroundMusicSrc);
nextAudio.loop = false;
nextAudio.muted = !forceAudible && !window.earthMusicEnabled;
nextAudio.volume = 0;
nextAudio.preload = "auto";
window.audio = nextAudio;
activeMusicAudios.add(nextAudio);

nextAudio.addEventListener("ended", () => {
if (session === musicSession && window.audio === nextAudio) {
playBackgroundTrack(session, musicLoopCrossfadeDuration, forceAudible);
}
if (window.audio === nextAudio) window.audio = null;
destroyAudioNow(nextAudio);
syncMusicMotion();
if (window.syncAudioUI) window.syncAudioUI();
}, { once: true });

nextAudio.play().then(() => {
syncMusicMotion();
animateAudioVolume(nextAudio, 0, musicVolume, musicLoopCrossfadeDuration);
animateAudioVolume(currentAudio, currentAudio.volume, 0, musicLoopCrossfadeDuration, () => {
destroyAudioNow(currentAudio);
syncMusicMotion();
});
armBackgroundLoop(nextAudio, session, forceAudible);
if (window.syncAudioUI) window.syncAudioUI();
}).catch(() => {
window.audio = currentAudio;
syncMusicMotion();
});
}

function earthPoint() {
const rect = earth.getBoundingClientRect();
const stageRect = stage ? stage.getBoundingClientRect() : { left: 0, top: 0, width: window.innerWidth, height: window.innerHeight };
const radius = Math.min(rect.width, rect.height) * .5;
const centerX = rect.left + rect.width * .5;
const centerY = rect.top + rect.height * .5;
let x;
let y;

if (Math.random() < .84) {
const zone = brightZones[Math.floor(Math.random() * brightZones.length)];
const angle = random(0, Math.PI * 2);
const distance = Math.sqrt(Math.random()) * zone.r;
x = zone.x + Math.cos(angle) * distance;
y = zone.y + Math.sin(angle) * distance;
} else {
const angle = random(0, Math.PI * 2);
const distance = Math.sqrt(Math.random()) * .42;
x = .5 + Math.cos(angle) * distance;
y = .5 + Math.sin(angle) * distance;
}

x = clamp(x, .12, .88);
y = clamp(y, .12, .88);
const px = rect.left + rect.width * x;
const py = rect.top + rect.height * y;
const outward = Math.atan2(py - centerY, px - centerX);
const freeAngle = Math.random() < .28 ? random(0, Math.PI * 2) : outward + random(-1.15, 1.15);
const distance = random(radius * 1.35, Math.max(stageRect.width, stageRect.height) * .58);

return {
x: px - stageRect.left,
y: py - stageRect.top,
angle: freeAngle,
distance,
radius
};
}

const originY = bottleRect.top + bottleRect.height / 2;
const focusX = focusRect.left + focusRect.width / 2;
const focusY = focusRect.top + focusRect.height / 2;
const scaleRatio = 2;
const projectedX = originX + (focusX - originX) * scaleRatio;
const projectedY = originY + (focusY - originY) * scaleRatio;

const screenDeltaY = stageRect.top + stageRect.height / 2 - projectedY;

const determinant = parentMatrix.a * parentMatrix.d - parentMatrix.b * parentMatrix.c;
const localDeltaX = determinant ? (parentMatrix.d * screenDeltaX - parentMatrix.c * screenDeltaY) / determinant : screenDeltaX;
const localDeltaY = determinant ? (-parentMatrix.b * screenDeltaX + parentMatrix.a * screenDeltaY) / determinant : screenDeltaY;
bottle.style.setProperty("--bottle-zoom-x", `${localDeltaX.toFixed(2)}px`);
bottle.style.setProperty("--bottle-zoom-y", `${localDeltaY.toFixed(2)}px`);

nextSpawn = now + (starAge < 15000 ? random(5000, 7000) : random(2000, 3200));
}

stars.forEach((star) => {
const age = now - star.born;
const progress = age / star.life;

if (progress >= 1 || star.clicked) {
if (!star.clicked) star.element.remove();
stars.delete(star);
return;
}

const moveProgress = clamp((age - star.hold) / (star.life - star.hold), 0, 1);
const easeMove = 1 - Math.pow(1 - moveProgress, 2.35);
const growProgress = clamp((age - star.hold) / star.grow, 0, 1);
const fadeIn = clamp(age / star.hold, 0, 1);
const fadeOut = clamp((1 - progress) / .26, 0, 1);
const breathe = .82 + Math.sin(now / 980 + star.phase) * star.breathePower;
const swayX = Math.sin(moveProgress * Math.PI * 3.3 + star.phase) * star.sway * moveProgress;
const swayY = Math.cos(moveProgress * Math.PI * 2.6 + star.phase) * star.sway * .52 * moveProgress;
const x = star.startX + (star.endX - star.startX) * easeMove + swayX;
const y = star.startY + (star.endY - star.startY) * easeMove + swayY;
const scale = (.22 + growProgress * 1.34) * (1 - progress * .36) * (1 + (breathe - .82) * .28);
const opacity = clamp(fadeIn * fadeOut * (.62 + breathe * .58), 0, 1);

star.currentX = x;
star.currentY = y;
star.element.style.opacity = opacity.toFixed(3);
star.element.style.transform = `translate3d(${x}px, ${y}px, 0) translate(-50%, -50%) scale(${scale.toFixed(3)})`;
star.element.style.filter = `brightness(${(1.12 + breathe * 1.02).toFixed(2)}) saturate(1.48)`;
});

requestAnimationFrame(updateVoiceStars);
}

// Let the identity appear with the arriving earth, rather than waiting for
// the opening sound. The interaction guide starts only after it has faded.
setTimeout(showHomeIntro, 1700);
// RHYTHM TEST: open the first heart star early so one is clickable by ~6s.
// No guide gate; later stars keep spawning but never block the first one.
setTimeout(startVoiceStars, 4000);
document.addEventListener("pointerdown", (event) => {
if (event.target.closest && event.target.closest(".voice-star")) return;
unlockEarthSounds();
}, { passive: true });
requestAnimationFrame(updateVoiceStars);
})();
</script>

  var navT = (window.performance && performance.timing && performance.timing.navigationStart) ? performance.timing.navigationStart : Date.now();
  function now() { return Math.round((window.performance && performance.now) ? performance.now() : (Date.now() - navT)); }
  function show(html) {
    var bar = document.getElementById("perfBar");
    if (!bar) {
      bar = document.createElement("div");
      bar.id = "perfBar";
      bar.style.cssText = "position:fixed;right:8px;top:64px;z-index:99999;background:rgba(0,0,0,.82);color:#7CFFB2;font:11px/1.6 monospace;padding:8px 10px;border-radius:10px;white-space:pre;max-width:78vw;pointer-events:none;";
      document.body.appendChild(bar);
    }
    bar.innerHTML = html;
  }
  var R = { dcl: "-", load: "-", firstCanvas: "-" };
  document.addEventListener("DOMContentLoaded", function () { R.dcl = now(); });
  window.addEventListener("load", function () { R.load = now(); });
  var tries = 0;
  function poll() {
    tries++;
    if (R.firstCanvas === "-") {
      var canvases = document.querySelectorAll("canvas");
      for (var i = 0; i < canvases.length; i++) {
        try {
          var c = canvases[i].getContext && canvases[i].getContext("2d");
          var d = c && c.getImageData ? c.getImageData(0, 0, Math.min(4, canvases[i].width), Math.min(4, canvases[i].height)).data : null;
          if (d) { for (var j = 3; j < d.length; j += 4) { if (d[j] !== 0) { R.firstCanvas = now(); break; } } }
        } catch (e) {}
        if (R.firstCanvas !== "-") break;
      }
    }
    if (R.firstCanvas !== "-" || tries > 400) {
      show("首页 perf\n→ DOMContentLoaded: " + R.dcl + "ms\n→ load: " + R.load + "ms\n→ 首个画布帧(兔子演示开始): " + R.firstCanvas + "ms");
      return;
    }
    setTimeout(poll, 50);
  }
  setTimeout(poll, 100);
  setTimeout(function () { show("首页 perf(超时)\n→ DOMContentLoaded: " + R.dcl + "ms\n→ load: " + R.load + "ms\n→ 首个画布帧: " + R.firstCanvas + "ms"); }, 20000);
})();

<script>

   the first star so the flow can be verified headless. */
(function () {
var marks = { pageStart: 0 };
window.__rhythmMarks = marks;
var firstStar = null;
var clickedStar = null;
function setMark(key) { if (!(key in marks)) marks[key] = Math.round(performance.now()); }
var labels = { pageStart: "页面开始", earthVisible: "地球可见", earthSpin: "地球转动", guideHint: "轻抚提示", starVisible: "首星可见", starClickable: "首星可点", userClick: "点击", feedback: "点击反馈", bottleStart: "瓶出现", rabbitVisible: "兔可见", formalContent: "正式内容" };
var order = ["pageStart", "earthVisible", "earthSpin", "guideHint", "starVisible", "starClickable", "userClick", "feedback", "bottleStart", "rabbitVisible", "formalContent"];

setInterval(function () {
  var intro = document.querySelector(".home-intro");
  var wEl = document.getElementById("homeIntroWelcome");
  if (intro && wEl && intro.classList.contains("is-visible")) {
    var langEn = (document.documentElement.lang || "zh").indexOf("en") === 0;
    var txt = langEn ? "Welcome. Hear yourself, and see each other." : "欢迎来到这里，听见自己，也看见彼此";
    if (wEl.textContent !== txt) wEl.textContent = txt;
  }
  var ap = document.querySelector(".approach");
  if (!("earthVisible" in marks) && ap) {
    var r = ap.getBoundingClientRect();
    if (r.width > 60) setMark("earthVisible");
  }
  if (!("earthSpin" in marks) && ("earthVisible" in marks)) {
    var ea = document.querySelector(".earth");
    if (ea) {
      var m = new DOMMatrixReadOnly(getComputedStyle(ea).transform);
      if (Math.abs(m.a - 1) > 0.002 || Math.abs(m.b) > 0.002) setMark("earthSpin");
    }
  }
  var stars = document.querySelectorAll(".voice-star");
  if (!("starVisible" in marks) && stars.length) {
    var el = stars[0];
    var cs = getComputedStyle(el);
    var rr = el.getBoundingClientRect();
    if (parseFloat(cs.opacity) > 0.5 && rr.width > 6) { setMark("starVisible"); firstStar = el; }
  }
  if (firstStar && !("starClickable" in marks)) {
    var rc = firstStar.getBoundingClientRect();
    var hit = document.elementFromPoint(rc.left + rc.width / 2, rc.top + rc.height / 2);
    if (hit && (hit === firstStar || firstStar.contains(hit))) setMark("starClickable");

  if (!("bottleStart" in marks) && document.querySelector(".voice-bottle")) setMark("bottleStart");
  var rab = document.querySelector(".fengxin-rabbit-demo");
  if (!("rabbitVisible" in marks) && rab) {
    var rs = getComputedStyle(rab);
    var rr2 = rab.getBoundingClientRect();
    if (parseFloat(rs.opacity) > 0.5 && rr2.width > 24) setMark("rabbitVisible");
  }
  if (!("formalContent" in marks)) {
    var text = document.querySelector(".voice-letter-text");
    var awake = rab && rab.classList.contains("is-awakening");
    if ((text && text.firstElementChild) || awake) setMark("formalContent");
  }
}, 30);

document.addEventListener("click", function (e) {
  var t = e.target && e.target.closest ? e.target.closest(".voice-star") : null;
  if (t && !("userClick" in marks)) { marks.userClick = Math.round(performance.now()); clickedStar = t; }

// Timing panel is debug-only: hidden by default, show with ?panel=1.
var panel = null;
if (new URLSearchParams(location.search).get("panel") === "1") {
  panel = document.createElement("div");
  panel.style.cssText = "position:fixed;left:8px;top:8px;z-index:99999;background:rgba(0,0,0,.78);color:#9fe8ff;font:11px/1.5 Menlo,monospace;padding:6px 10px;border-radius:8px;pointer-events:none;white-space:pre;max-width:92vw;";
  document.body.appendChild(panel);
}
function pad(s, n) { while (s.length < n) s += " "; return s; }
function render() {
  if (!panel) return;
  var lines = [];
  for (var i = 0; i < order.length; i++) {
    var k = order[i];
    if (k in marks) lines.push(pad(labels[k], 8) + "  " + marks[k] + "ms");
  }
  panel.textContent = "— 交互节奏时间表 (自页面开始) —\n" + lines.join("\n") + "\n(?panel=1 显示本面板)";

if (panel) requestAnimationFrame(render);

/* "轻抚一颗心，遇见一个世界" light, non-blocking hint */

function scheduleAt(absMs, fn) {
  setTimeout(fn, Math.max(0, absMs - performance.now()));

function hideHint() {
