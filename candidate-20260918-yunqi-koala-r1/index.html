<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>云栖考拉 · 上线前真机验证（Candidate）</title>
<style>
  :root{
    --bg:#05060d; --card:#0d1020; --line:#252a44; --text:#e8ebff; --dim:#9aa3c7;
    --accent:#7d8bff; --ok:#42d392; --warn:#ffb020; --bad:#ff5c72;
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  body{display:flex;justify-content:center}
  .app{width:100%;max-width:430px;min-height:100svh;padding:14px 14px calc(18px + var(--safe-b));
    display:flex;flex-direction:column;gap:12px}
  h1{font-size:17px;margin:0;letter-spacing:.02em}
  .sub{color:var(--dim);font-size:11.5px;margin:3px 0 0}
  .tag{display:inline-block;padding:1px 7px;border:1px solid var(--line);border-radius:999px;
    font-size:10.5px;color:var(--dim);margin-right:6px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}

  .stagewrap{position:relative}
  .stage{position:relative;width:100%;aspect-ratio:3/4;border-radius:14px;overflow:hidden;
    border:1px solid var(--line);background:#000}
  .stage.checker{background-color:#2a2f45;
    background-image:linear-gradient(45deg,#20243a 25%,transparent 25%,transparent 75%,#20243a 75%),
                     linear-gradient(45deg,#20243a 25%,transparent 25%,transparent 75%,#20243a 75%);
    background-size:22px 22px;background-position:0 0,11px 11px}
  .stage.white{background:#fff}
  .stage.black{background:#000}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
  .badge{position:absolute;left:8px;top:8px;padding:3px 8px;border-radius:999px;
    font-size:10.5px;background:rgba(5,7,18,.78);border:1px solid var(--line);color:var(--dim)}
  .badge.ok{color:var(--ok);border-color:rgba(66,211,146,.5)}
  .badge.warn{color:var(--warn);border-color:rgba(255,176,32,.5)}
  .badge.bad{color:var(--bad);border-color:rgba(255,92,114,.5)}
  .banner{margin-top:8px;padding:8px 10px;border-radius:10px;font-size:11.5px;
    border:1px solid rgba(255,176,32,.45);background:rgba(255,176,32,.08);color:#ffd28a}

  .segs{display:flex;gap:6px;flex-wrap:wrap}
  .seg{padding:5px 10px;border-radius:9px;border:1px solid var(--line);background:#121731;
    color:var(--dim);font-size:12px}
  .seg.on{border-color:var(--accent);color:#fff;background:#1b2350}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .btn{padding:9px 4px;border-radius:11px;border:1px solid var(--line);background:#141a35;
    color:var(--text);font-size:12.5px;text-align:center}
  .btn.on{border-color:var(--accent);background:#1d2657}
  .btn .no{display:block;font-size:10px;color:var(--dim)}

  .rows{display:flex;flex-direction:column;gap:5px;font-size:11.5px}
  .row{display:flex;gap:8px;justify-content:space-between;align-items:flex-start}
  .row .k{color:var(--dim);flex:0 0 96px}
  .row .v{flex:1;text-align:right;word-break:break-all;font-variant-numeric:tabular-nums}
  .v.ok{color:var(--ok)} .v.warn{color:var(--warn)} .v.bad{color:var(--bad)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  textarea{width:100%;height:120px;margin-top:8px;border-radius:10px;border:1px solid var(--line);
    background:#080b18;color:var(--dim);font:10.5px/1.4 ui-monospace,Menlo,monospace;padding:8px}
  .actions{display:flex;gap:8px;margin-top:8px}
  .actions button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);
    background:#141a35;color:var(--text);font-size:12.5px}
  h2{font-size:12px;margin:0 0 8px;color:var(--dim);font-weight:600;letter-spacing:.04em}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>云栖考拉 · 上线前真机验证</h1>
    <p class="sub">
      <span class="tag">Candidate</span>
      Android/Chrome → VP9 WebM Alpha ｜ iPhone/Safari → Apple HEVC Alpha（待 Mac）
    </p>
  </header>

  <div class="stagewrap">
    <div class="stage checker" id="stage">
      <video id="video" playsinline muted autoplay loop preload="auto"></video>
      <div class="badge" id="badge">准备中…</div>
    </div>
    <div class="segs" style="margin-top:8px">
      <button class="seg on" data-bg="checker">透明棋盘</button>
      <button class="seg" data-bg="black">纯黑底</button>
      <button class="seg" data-bg="white">纯白底</button>
    </div>
    <div class="banner" id="banner" hidden></div>
  </div>

  <div class="card">
    <h2>情绪视频（01–11）</h2>
    <div class="grid" id="list"></div>
  </div>

  <div class="card">
    <h2>实时验证</h2>
    <div class="rows">
      <div class="row"><span class="k">设备分支</span><span class="v mono" id="vBranch">-</span></div>
      <div class="row"><span class="k">选用格式</span><span class="v mono" id="vKind">-</span></div>
      <div class="row"><span class="k">视频尺寸</span><span class="v mono" id="vSize">-</span></div>
      <div class="row"><span class="k">时长 / 帧率</span><span class="v mono" id="vDur">-</span></div>
      <div class="row"><span class="k">Alpha 实测</span><span class="v mono" id="vAlpha">-</span></div>
      <div class="row"><span class="k">四角 Alpha</span><span class="v mono" id="vCorners">-</span></div>
      <div class="row"><span class="k">播放质量</span><span class="v mono" id="vQuality">-</span></div>
      <div class="row"><span class="k">当前来源</span><span class="v mono" id="vSrc">-</span></div>
    </div>
    <div class="actions">
      <button id="btnRefresh">重测 Alpha</button>
      <button id="btnCopy">复制诊断</button>
    </div>
    <textarea id="diag" readonly spellcheck="false"></textarea>
  </div>
</div>

<script src="seven-stars-media-resolver.js"></script>
<script>
(function () {
  var MANIFEST_URL = "seven-stars-assets-manifest.json";
  var CHARACTER_ID = "yunqi-koala";
  var video = document.getElementById("video");
  var stage = document.getElementById("stage");
  var badge = document.getElementById("badge");
  var banner = document.getElementById("banner");
  var listEl = document.getElementById("list");
  var diagEl = document.getElementById("diag");
  var canvas = document.createElement("canvas");
  var ctx = canvas.getContext("2d", { willReadFrequently: true });

  var entries = [];       // [{itemId, label, no, item}]
  var current = null;
  var resolver = window.LuguSevenStarsMediaResolver;
  var branch = resolver ? resolver.detectBranch() : "unknown";

  function setV(id, text, cls) {
    var el = document.getElementById(id);
    el.textContent = text;
    el.className = "v mono" + (cls ? " " + cls : "");
  }

  function pickCandidate(cands) {
    for (var i = 0; i < cands.length; i++) {
      var c = cands[i];
      if (!c.url) continue;
      if (!c.type) return c;
      var ok = video.canPlayType(c.type);
      if (ok && ok !== "no") return c;
    }
    for (var j = 0; j < cands.length; j++) { if (cands[j].url) return cands[j]; }
    return null;
  }

  function probeAlpha() {
    if (!video.videoWidth || video.readyState < 2) return null;
    var w = 180;
    var h = Math.max(1, Math.round(w * video.videoHeight / video.videoWidth));
    canvas.width = w; canvas.height = h;
    ctx.clearRect(0, 0, w, h);
    try { ctx.drawImage(video, 0, 0, w, h); }
    catch (e) { return { error: "drawImage 失败: " + e.message }; }
    var data;
    try { data = ctx.getImageData(0, 0, w, h).data; }
    catch (e) { return { error: "canvas 被跨域污染，无法读取像素（需同源托管）" }; }
    var corners = [[2, 2], [w - 3, 2], [2, h - 3], [w - 3, h - 3]].map(function (p) {
      return data[(p[1] * w + p[0]) * 4 + 3];
    });
    var transparent = 0, opaque = 0, partial = 0, total = data.length / 4;
    for (var i = 3; i < data.length; i += 4) {
      var a = data[i];
      if (a < 8) transparent++; else if (a > 247) opaque++; else partial++;
    }
    var tr = transparent / total, op = opaque / total;
    var verdict, cls;
    if (tr > 0.15 && corners.every(function (c) { return c < 8; })) {
      verdict = "真透明已生效（" + (tr * 100).toFixed(1) + "% 全透明像素）"; cls = "ok";
    } else if (tr > 0.15) {
      verdict = "透明已生效，但四角非全透明（" + (tr * 100).toFixed(1) + "%）"; cls = "warn";
    } else {
      verdict = "未检测到透明（全不透明像素 " + (op * 100).toFixed(1) + "%）"; cls = "bad";
    }
    return { corners: corners, transparentRatio: tr, opaqueRatio: op, partialRatio: partial / total, verdict: verdict, cls: cls };
  }

  function qualityText() {
    var q = video.getVideoPlaybackQuality ? video.getVideoPlaybackQuality() : null;
    if (!q) return "-";
    return "总帧 " + q.totalVideoFrames + " / 丢帧 " + q.droppedVideoFrames;
  }

  function renderDiag(alpha) {
    var info = {
      candidate: "candidate-20260918-yunqi-koala-r1",
      time: new Date().toISOString(),
      userAgent: navigator.userAgent,
      platform: navigator.platform,
      branch: branch,
      itemId: current ? current.itemId : null,
      emotion: current ? current.label : null,
      kind: current ? current.kind : null,
      src: video.currentSrc,
      videoWidth: video.videoWidth,
      videoHeight: video.videoHeight,
      duration: video.duration,
      readyState: video.readyState,
      canPlay: {
        vp9: video.canPlayType('video/webm; codecs="vp9"'),
        hevc: video.canPlayType('video/mp4; codecs="hvc1"'),
        h264: video.canPlayType("video/mp4")
      },
      alpha: alpha || null,
      playback: video.getVideoPlaybackQuality ? video.getVideoPlaybackQuality() : null
    };
    diagEl.value = JSON.stringify(info, null, 2);
    return info;
  }

  function refresh() {
    var alpha = probeAlpha();
    setV("vBranch", branch);
    setV("vKind", current ? (current.kind || "-") : "-");
    setV("vSize", video.videoWidth ? (video.videoWidth + "×" + video.videoHeight) : "-");
    setV("vDur", video.duration ? (video.duration.toFixed(2) + "s / " + (video.getVideoPlaybackQuality ? "见丢帧" : "-")) : "-");
    setV("vQuality", qualityText());
    setV("vSrc", video.currentSrc ? video.currentSrc.split("/").slice(-1)[0] : "-");
    if (!alpha) {
      setV("vAlpha", "等待视频解码…");
      setV("vCorners", "-");
    } else if (alpha.error) {
      setV("vAlpha", alpha.error, "bad");
      setV("vCorners", "-");
    } else {
      setV("vAlpha", alpha.verdict, alpha.cls);
      setV("vCorners", alpha.corners.join(" / "));
    }
    if (current && current.kind !== "vp9") {
      badge.className = "badge warn";
      badge.textContent = current.kind === "hevc" ? "HEVC Alpha" : "黑底回退（无透明）";
    } else if (alpha && !alpha.error && alpha.cls) {
      badge.className = "badge " + alpha.cls;
      badge.textContent = alpha.cls === "ok" ? "VP9 Alpha 正常" : (alpha.cls === "warn" ? "VP9 Alpha 有疑问" : "未检测到透明");
    }
    renderDiag(alpha);
  }

  function play(itemId) {
    var entry = entries.filter(function (e) { return e.itemId === itemId; })[0];
    if (!entry) return;
    var res = resolver.resolve({ itemId: itemId });
    var chosen = pickCandidate(res.candidates);
    current = chosen ? { itemId: itemId, label: entry.label, kind: chosen.kind } : null;
    if (!chosen) {
      setV("vAlpha", "没有可用候选", "bad");
      return;
    }
    video.src = chosen.url;
    video.load();
    var p = video.play();
    if (p && p.catch) { p.catch(function () {}); }
    Array.prototype.forEach.call(listEl.children, function (b) {
      b.classList.toggle("on", b.dataset.item === itemId);
    });
    banner.hidden = (branch !== "iphone-safari") || (res.candidates[0] && res.candidates[0].kind === "hevc");
    banner.textContent = "iPhone/Safari 的 Apple HEVC Alpha 尚未接入（等 Mac avconvert 产出）；当前显示的是黑底回退版本，看不到透明。Android/Chrome 请看 VP9 Alpha。";
    refresh();
  }

  resolver.load(MANIFEST_URL).then(function (manifest) {
    if (!manifest) { badge.textContent = "manifest 加载失败"; return; }
    var items = Object.keys(manifest.items).filter(function (k) {
      return manifest.items[k].characterId === CHARACTER_ID;
    }).map(function (k) { return manifest.items[k]; })
      .sort(function (a, b) { return String(a.sequence).localeCompare(String(b.sequence)); });
    entries = items.map(function (it) {
      return { itemId: it.itemId, label: it.emotionLabel || it.itemId, no: it.sequence, item: it };
    });
    listEl.innerHTML = "";
    entries.forEach(function (e) {
      var b = document.createElement("button");
      b.className = "btn";
      b.dataset.item = e.itemId;
      b.innerHTML = '<span class="no">' + e.no + '</span>' + e.label;
      b.addEventListener("click", function () { play(e.itemId); });
      listEl.appendChild(b);
    });
    if (entries.length) { play(entries[0].itemId); }
  });

  Array.prototype.forEach.call(document.querySelectorAll(".seg"), function (s) {
    s.addEventListener("click", function () {
      Array.prototype.forEach.call(document.querySelectorAll(".seg"), function (x) { x.classList.remove("on"); });
      s.classList.add("on");
      stage.className = "stage " + s.dataset.bg;
    });
  });
  document.getElementById("btnRefresh").addEventListener("click", refresh);
  document.getElementById("btnCopy").addEventListener("click", function () {
    diagEl.select();
    try { document.execCommand("copy"); } catch (e) {}
    if (navigator.clipboard) { navigator.clipboard.writeText(diagEl.value).catch(function () {}); }
    this.textContent = "已复制";
    var self = this;
    setTimeout(function () { self.textContent = "复制诊断"; }, 1500);
  });
  video.addEventListener("loadeddata", refresh);
  video.addEventListener("seeked", refresh);
  setInterval(refresh, 700);
})();
</script>
</body>
</html>
