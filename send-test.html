<title>七星使者 · 情绪表达</title>
<style>  :root { --bg:#0b0c18; --card:#17192e; --ink:#eef0ff; --muted:#9aa0c3; --accent:#7d8bff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; padding:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
    -webkit-font-smoothing:antialiased; overflow:hidden; }
  .app { display:flex; flex-direction:column; height:100dvh; padding:calc(env(safe-area-inset-top,0px)+16px) 16px calc(env(safe-area-inset-bottom,0px)+10px); }
  .brand { display:flex; align-items:center; gap:8px; margin:8px 0 0 20px; font-size:17px; font-weight:450; letter-spacing:.02em; color:rgba(238,240,255,.82); }
  .site-logo { display:inline-flex; align-items:center; gap:5px; color:rgba(238,240,255,.72); text-decoration:none; font-size:13px; font-weight:400; letter-spacing:.04em; padding:4px 6px 4px 0; border-radius:999px; }
  .site-logo img { width:26px; height:26px; flex:0 0 26px; filter:drop-shadow(0 0 4px rgba(255,222,143,.4)); }
  html.is-app-bridge .site-logo { display:none !important; }
  .brand .heart { color:rgba(238,240,255,.82); margin-right:5px; font-weight:400; }
  .brand .heart svg { width:17px; height:15px; }
  .brand-sub { opacity:.66; font-weight:350; margin-left:3px; }
  .brand-a { font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; font-weight:500; letter-spacing:.02em; }
  .brand-b { font-family:"Kaiti SC","STKaiti","KaiTi",serif; font-weight:400; letter-spacing:.01em; }
  .brand-c { font-family:"Avenir Next","PingFang SC","Hiragino Sans GB",sans-serif; font-weight:450; letter-spacing:.015em; }
  .guide { margin:6px 0 0 16px; font-size:13px; color:rgba(207,198,235,.58); transition:opacity .2s ease; }
  .stage-wrap { display:flex; align-items:center; justify-content:center; min-height:0; pointer-events:none; margin-top:8px; }
  #stage { width:min(68vw,300px); height:auto; border-radius:18px; pointer-events:none; }
  .emotions { display:flex; justify-content:center; gap:20px; margin:18px 0 10px; position:relative; z-index:30; }
  .emotion { flex:0 1 auto; padding:10px 20px; border-radius:999px; border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.05); color:var(--muted); font-size:13px; font-weight:600; cursor:pointer; text-align:center; white-space:nowrap; }
  .emotion.active { color:#fff; border-color:var(--accent); background:rgba(125,139,255,.22); box-shadow:0 0 16px rgba(125,139,255,.28); }
  .sub-actions { display:flex; align-items:center; justify-content:center; gap:6px; margin:8px 0 0; flex-wrap:wrap; }
  .sub-actions .suggest { margin:0; flex:0 1 auto; min-width:0; height:34px; display:inline-flex; align-items:center; gap:6px; padding:0 10px; border:1px solid rgba(255,255,255,.14); border-radius:999px; background:rgba(255,255,255,.05); color:#b8c0ff; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .voice-mini { display:inline-flex; align-items:center; gap:6px; flex:0 1 auto; min-width:0; height:34px; padding:0 10px; border:1px solid rgba(255,255,255,.12); border-radius:999px; background:rgba(255,255,255,.05); }
  .voice-mini .voice-icon { font-size:12px; line-height:1; color:var(--muted); flex:0 0 auto; }
  .voice-select { height:30px; max-width:100px; min-width:0; padding:0 2px; border:none; background:transparent; color:#b8c0ff; font-size:12px; font-weight:600; outline:none; }
  .voice-preview { flex:0 1 auto; min-width:0; height:34px; display:inline-flex; align-items:center; gap:6px; padding:0 10px; border:1px solid rgba(255,255,255,.14); border-radius:999px; background:rgba(255,255,255,.05); color:#b8c0ff; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .voice-preview:disabled { opacity:.55; cursor:default; }
  .suggest-box { display:flex; flex-direction:column; flex-shrink:0; margin-top:6px; padding:0 16px; max-height:132px; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .suggest-chip { display:flex; align-items:flex-start; gap:9px; text-align:left; padding:11px 0; border:none; background:transparent; border-bottom:1px solid rgba(255,255,255,.06); color:rgba(224,218,240,.82); font-size:13px; line-height:1.4; cursor:pointer; }

  .suggest-chip.selected { color:#fff; background:rgba(125,139,255,.10); }

  html.is-app-bridge #btnSend { display:none !important; }

  html.state-done .sub-actions,

  html.state-done .success-actions { order:4; }
  html.state-done .debug { order:99; }
  button { flex:1; min-width:82px; height:44px; border-radius:14px; border:none; font-size:14px; font-weight:650; cursor:pointer; }
  .btn-primary { background:linear-gradient(135deg,#7d8bff,#a06bff); color:#fff; }
  #btnGenerate { width:100%; height:46px; font-size:15px; border-radius:14px; background:rgba(125,139,255,.16); color:rgba(238,240,255,.92); border:1px solid rgba(125,139,255,.20); box-shadow:none; }
  .btn-secondary { background:rgba(255,255,255,.08); color:var(--ink); border:1px solid rgba(255,255,255,.14); }
  button:disabled { opacity:.55; }
  .status { min-height:18px; margin:8px 0 0; text-align:center; font-size:13px; color:#ffd47f; }
  .status.ok { color:#a9e3a0; }
  .status.err { color:#ff9aa6; }
  .hint { min-height:14px; margin:4px 0 0; text-align:center; font-size:12px; color:var(--muted); }
  .video-tap-hint { text-align:center; font-size:11px; letter-spacing:.08em; color:rgba(255,255,255,.42); margin:8px 0 0; }
  video { width:100%; max-height:30vh; border-radius:14px; margin-top:8px; background:#000; }
  html.state-done #videoPreview { display:block; align-self:center; width:auto; height:54svh; max-height:56svh; max-width:100%; aspect-ratio:9/16; object-fit:contain; border-radius:16px; background:#000; margin:0; }
  .toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); z-index:9; padding:9px 14px; border-radius:999px; background:rgba(20,22,40,.88); border:1px solid rgba(255,255,255,.16); color:#fff; font-size:12px; opacity:0; transition:opacity .25s; max-width:80vw; text-align:center; }
  .toast.show { opacity:1; }
  .debug { margin-top:8px; font-size:11px; color:rgba(255,255,255,.35); border-top:1px solid rgba(255,255,255,.06); padding-top:4px; }
  .debug summary { cursor:pointer; padding:3px 0; font-size:11px; color:rgba(255,255,255,.35); }
  .diag { margin-top:6px; padding:8px 10px; border:1px solid rgba(255,255,255,.12); border-radius:10px; background:rgba(0,0,0,.22); font-size:11px; color:var(--muted); line-height:1.6; word-break:break-all; }
  .diag b { color:#b8c0ff; }
  .site-paused-overlay { display:none; position:fixed; inset:0; z-index:9999; background:var(--bg); align-items:center; justify-content:center; flex-direction:column; padding:0 34px; text-align:center; }
  .site-paused-overlay.show { display:flex; }
  .site-paused-overlay .t1 { font-size:18px; font-weight:500; letter-spacing:.02em; color:rgba(238,240,255,.92); }
  .site-paused-overlay .t2 { margin-top:14px; font-size:13px; color:rgba(154,160,195,.8); line-height:1.7; }
</style>

<script>
(function () {
  var app = document.querySelector('.app');
  var staticOn = window.TEST_SITE_ENABLED !== false;
  function pause() {
    window.__SITE_PAUSED__ = true;
    var ps = document.getElementById('pauseScreen');
    if (ps) ps.className += ' show';
    if (app) app.style.display = 'none';
  }
  function start() {
    window.__SITE_PAUSED__ = false;
    if (app) app.style.display = '';
    if (typeof window.__MAIN__ === 'function') {
      window.__MAIN__();
    } else {
      window.__MAIN_PENDING__ = true;
    }
  }
  if (!staticOn) { pause(); return; }
  if (app) app.style.display = 'none';
  try {
    fetch('https://api.lugu.love/status', { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('status ' + r.status); return r.json(); })
      .then(function (d) { if (d && d.enabled === false) { pause(); } else { start(); } })
      .catch(function () { start(); });
  } catch (e) { start(); }
})();
</script>




<script>
window.__MAIN__ = function () {
  var MAKE_SEND_API = "https://api.lugu.love";
  var GENERATE_TIMEOUT_MS = 55000;
  var BLOB_TIMEOUT_MS = 20000;

  // 三情绪映射唯一来源：scripts/make-send-cloud/emotion-manifest.json（官方配置）。
  // 下方为离线/加载失败兜底；正常路径由 manifest 派生，前端不再自持第二套映射。
  var EMOTIONS_FALLBACK = [
    { id:"1", name:"开心", item:"rabbit-happy", totalFrames:73, sheetCount:7, previewProxy:"mobile/1" },
    { id:"2", name:"委屈", item:"rabbit-aggrieved", totalFrames:91, sheetCount:8, previewProxy:"mobile/2" },
    { id:"3", name:"生气", item:"rabbit-angry", totalFrames:109, sheetCount:10, previewProxy:"mobile/3" }
  ];
  var EMOTIONS = EMOTIONS_FALLBACK.slice();

  function loadEmotionManifest(){
    return fetch("scripts/make-send-cloud/emotion-manifest.json", { cache:"no-store" })
      .then(function(r){ if(!r.ok) throw new Error("manifest " + r.status); return r.json(); })
      .then(function(m){
        var src = (m && m.emotions) || {};
        var list = ["rabbit-happy","rabbit-aggrieved","rabbit-angry"].map(function(itemId){
          var e = src[itemId];
          if(!e) return null;
          return {
            id: String(e.sequenceId || ""),
            name: e.label || itemId,
            item: e.itemId || itemId,
            totalFrames: e.previewFrames,
            sheetCount: e.previewSheets,
            previewProxy: e.previewProxy
          };
        });
        if(list.length === 3 && list.every(function(x){ return x && x.id && x.sheetCount > 0; })){
          EMOTIONS = list;
          return true;
        }
        return false;
      })
      .catch(function(){ return false; });
  }

  var GUIDES = {
    "1": "把这份开心，说给你想分享的人。",
    "2": "有些委屈，不知道怎么说也没关系。",
    "3": "把不开心说出来，也是一种表达。"
  };

  var SUGGESTIONS = {
    "1": [
      "今天心情不错，想把这份开心也分给你。",
      "今天有点开心，忍不住想告诉你。",
      "嘿，今天的快乐有点藏不住了。",
      "没什么大事，就是突然觉得今天挺美好。",
      "今天想笑，也想让你跟着笑一下。"
    ],
    "2": [
      "我没事，就是有一点想被抱抱。",
      "嘴上说没事，其实还是有一点难过。",
      "今天不想讲道理，只想被哄一下。",
      "我不是生气，我只是有点委屈。",
      "如果你愿意，抱抱我就好了。"
    ],
    "3": [
      "我现在真的有点生气，让我缓一缓。",
      "这次我是真的不开心了。",
      "我不是故意凶，我只是现在有点气。",
      "有些话我不想憋着，这次真的让我不舒服。",
      "我先气一会儿，等我消消气再说。"
    ]
  };

  var FRAME_SIZE=270, FRAMES_PER_SHEET=12, COLS=4, FRAME_RATE=18;   // 移动端轻量 B 规格
  var RENDER_SIZE=375, RENDER_X=Math.round((540-RENDER_SIZE)/2), RENDER_Y=69;

  var canvas=document.getElementById("stage"), ctx=canvas.getContext("2d");
  var emotionsEl=document.getElementById("emotions");
  var textInput=document.getElementById("textInput");
  var charCountEl=document.getElementById("charCount");
  var previewTextEl=document.getElementById("previewText");
  var statusEl=document.getElementById("status");
  var hintEl=document.getElementById("hint");
  var videoEl=document.getElementById("videoPreview");
  var diagEl=document.getElementById("diag");
  var preloadDiagEl=document.getElementById("preloadDiag");
  var tapDiagEl=document.getElementById("tapDiag");
  var genCount=0;
  var NO_PRELOAD = new URLSearchParams(location.search).get("nopreload") === "1";
  var brandEl=document.getElementById("brand");
  var brandParam = new URLSearchParams(location.search).get("brand");
  if(brandEl && brandParam){ brandEl.classList.add("brand-" + brandParam); }
  var lastTiming=null;
  var generatePhase="idle";
  var isGenerating=false;
  var activeController=null;
  var guideEl=document.getElementById("guide");
  var btnSuggest=document.getElementById("btnSuggest");
  var suggestBox=document.getElementById("suggestBox");
  var btnGenerate=document.getElementById("btnGenerate");
  var btnOpen=document.getElementById("btnOpen");
  var btnSave=document.getElementById("btnSave");
  var btnSend=document.getElementById("btnSend");
  var btnReEdit=document.getElementById("btnReEdit");
  var btnHome=document.getElementById("btnHome");
  var videoTapHint=document.getElementById("videoTapHint");
  var btnSendWeChat=document.getElementById("btnSendWeChat");
  var bridgeDiagEl=document.getElementById("bridgeDiag");
  var debugDetailsEl=document.getElementById("debugDetails");
  var toastEl=document.getElementById("toast");

  var isIOS=/iPad|iPhone|iPod/.test(userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var isAndroid=/Android/i.test(userAgent);
  var isWeChat=/MicroMessenger/i.test(userAgent);
  if(isIOS){ document.documentElement.classList.add("is-ios"); btnSave.textContent="打开并分享"; }
  if(isAndroid){ document.documentElement.classList.add("is-android"); btnOpen.textContent="打开预览"; }
  if(isWeChat){ document.documentElement.classList.add("is-wechat"); }
  var isAppBridge = !!(window.AndroidShare && typeof window.AndroidShare.prepareVideo === "function" && typeof window.AndroidShare.sharePreparedVideo === "function");
  var nativeReady=false, nativeVideoPath="";
  var __SEND_TEST_VERSION__ = "2026-08-29-bridge-v14";
  var bridgeDiag = { prepareCalled:false, lastNativeEvent:null, nativeStatus:null };
  function bridgeAvailable(){
    return !!(window.AndroidShare && typeof window.AndroidShare.prepareVideo === "function" && typeof window.AndroidShare.sharePreparedVideo === "function");
  }
  function renderBridgeDiag(){
    if(!bridgeDiagEl) return;
    var lines = [];
    lines.push("<b>页面版本:</b> " + __SEND_TEST_VERSION__);
    lines.push("<b>URL:</b> " + location.href);
    lines.push("<b>typeof AndroidShare:</b> " + (typeof window.AndroidShare));
    lines.push("<b>prepareVideo:</b> " + (window.AndroidShare && typeof window.AndroidShare.prepareVideo === "function" ? "有" : "无")
      + " ｜ sharePreparedVideo: " + (window.AndroidShare && typeof window.AndroidShare.sharePreparedVideo === "function" ? "有" : "无")
      + " ｜ getStatus: " + (window.AndroidShare && typeof window.AndroidShare.getStatus === "function" ? "有" : "无"));
    lines.push("<b>isAppBridge:</b> " + (isAppBridge ? "true" : "false") + " ｜ html class: " + (document.documentElement.className || "(空)"));
    lines.push("<b>finalMp4Url(nativeVideoPath):</b> " + (nativeVideoPath || "(空)"));
    lines.push("<b>prepareVideo 已调用:</b> " + (bridgeDiag.prepareCalled ? "是" : "否"));
    lines.push("<b>nativeReady:</b> " + (nativeReady ? "true" : "false"));
    if(bridgeDiag.lastNativeEvent){
      lines.push("<b>最近 native 事件:</b> phase=" + bridgeDiag.lastNativeEvent.phase
        + " message=" + (bridgeDiag.lastNativeEvent.message || "")
        + " canShare=" + (bridgeDiag.lastNativeEvent.canShare ? "true" : "false")
        + " elapsedMs=" + (bridgeDiag.lastNativeEvent.elapsedMs || 0));
    }
    lines.push("<b>按钮:</b> 发微信 hidden=" + btnSendWeChat.hidden + " disabled=" + btnSendWeChat.disabled
      + " ｜ 打开预览 hidden=" + btnOpen.hidden
      + " ｜ 保存 hidden=" + btnSave.hidden
      + " ｜ 发送(Web) hidden=" + btnSend.hidden);
    if(bridgeDiag.nativeStatus){
      lines.push("<b>native getStatus:</b> " + bridgeDiag.nativeStatus);
    }
    bridgeDiagEl.innerHTML = lines.join("<br>");
  }
  function handoffToNative(){
    if(!isAppBridge || !nativeVideoPath || bridgeDiag.prepareCalled) return;
    bridgeDiag.prepareCalled = true;
    setStatus("视频已生成，正在准备发送…", "ok");
    setHint("");
    try {
      window.AndroidShare.prepareVideo(MAKE_SEND_API + nativeVideoPath);
    } catch(err){
      console.error("[send-test] prepareVideo threw", err);
      bridgeDiag.prepareCalled = false;
      nativeReady = false;
      if(btnSendWeChat){ btnSendWeChat.disabled = true; }
      setStatus("视频准备失败，请重新生成后再试", "err");
      document.documentElement.classList.add("show-save-fallback");
    }

  function previewVoice(){
    if(previewState==="playing"){ stopPreviewAudio(); previewState="idle"; resetPreviewButton(); return; }

    var text=(textInput.value||"").trim();

    previewState="loading";

        return resp.json().catch(function(){ return {}; }).then(function(d){ throw new Error((d&&d.message)||(d&&d.error)||("HTTP "+resp.status)); });

      });

      if(myReq!==previewReqId || !result) return;
      stopPreviewAudio();
      ttsToken=result.token || null;

      if(isIOS){
        if(!previewHtmlAudio){ try{ previewHtmlAudio=new Audio(); }catch(e){ previewHtmlAudio=null; } }
        previewAudioUrl=URL.createObjectURL(result.blob);
        previewHtmlAudio.src=previewAudioUrl;

        }

      previewAudio.onended=onPreviewAudioEnded;
      previewAudio.onerror=function(){ onPreviewAudioEnded(); };

      var job=jobData.job;
      // 长文本异步生成：后端立即返回 202 {job}，前端轮询 /make-send/result 拿 videoPath，
      // 避免单次长连接等待超过网络/代理容忍窗口而被切断。
      var videoPath="";
      var pollDeadline = Date.now() + 150000;
      generatePhase="polling";
      renderDiag();
      while(true){
        if(myToken !== genToken || cancelReason === "user" || !isGenerating){ return; }
        if(Date.now() > pollDeadline){
          if(activeController){ try{ activeController.abort(); }catch(e){} }
          throw new Error("generate timeout");
        }
        var pollUrl=MAKE_SEND_API + "/make-send/result?job=" + encodeURIComponent(job);
        var pollResp=await withTimeout(fetch(pollUrl, { cache:"no-store", mode:"cors" }), 20000, activeController);
        var pollJson=null;
        try { pollJson=await pollResp.json(); } catch(e){}
        if(!pollResp.ok || !pollJson){
          var perr=new Error("HTTP "+(pollResp ? pollResp.status : "?"));
          if(pollJson && (pollJson.error || pollJson.message)){ perr.backendMessage=pollJson.error || pollJson.message; }
          throw perr;
        }
        if(pollJson.status === "done" && pollJson.videoPath){ videoPath=pollJson.videoPath; break; }
        if(pollJson.status === "error"){
          var e3=new Error(pollJson.error || "生成失败");
          e3.backendMessage=pollJson.error || "生成失败";
          throw e3;
        }
        if(pollJson.status === "busy"){
          var e4=new Error(pollJson.error || "服务繁忙，请稍后重试");
          e4.backendMessage=pollJson.error || "服务繁忙，请稍后重试";
          throw e4;
        }
        await new Promise(function(res){ setTimeout(res, 2000); });
        if(myToken !== genToken || cancelReason === "user" || !isGenerating){ return; }
      }
      var vresp=await withTimeout(fetch(MAKE_SEND_API + videoPath, { cache:"no-store", mode:"cors", signal:activeController ? activeController.signal : undefined }), BLOB_TIMEOUT_MS, activeController);
      if(!vresp.ok) throw new Error("HTTP "+vresp.status);
      var tBlob = performance.now();
      var blob=await withTimeout(vresp.blob(), BLOB_TIMEOUT_MS, activeController);
      if(!blob || blob.size===0) throw new Error("empty blob");
      var file=new File([blob], "七星使者-" + current.name + ".mp4", { type:"video/mp4" });
      lastBlob=blob; lastFile=file;
      lastUrl=URL.createObjectURL(blob);
      videoEl.src=lastUrl; videoEl.hidden=false;
      var tDone = performance.now();
      lastTiming = { clickToFetchMs: Math.round(tFetchStart-tClick), fetchMs: Math.round(tHeaders-tFetchStart), blobMs: Math.round(tBlob-tHeaders), totalMs: Math.round(tDone-tClick) };
      generatePhase="success";
      if(isAppBridge){ nativeVideoPath = /^\/app-video\/[A-Za-z0-9_-]{20,128}\.mp4$/.test(videoPath) ? videoPath : ""; }
      setStatus("视频生成成功", "ok");
      document.documentElement.classList.add("state-done");
      var canShareFile = false;
      try { canShareFile = !!(navigator.canShare && navigator.canShare({files:[file]})); } catch(e) { canShareFile = false; }
      var shareHint;
      if(isIOS && !isWeChat && canShareFile){ shareHint = "点击“发给TA”，即可打开系统分享面板"; }
      else if(isIOS){ shareHint = "打开后，点击右上角‘…’即可分享"; }
      else if(isWeChat){ shareHint = "请在浏览器中打开后发送视频"; }
      else if(isAndroid){ shareHint = "点击“发给TA”，选择微信发送。"; }
      else { shareHint = "点击“发给TA”，可选择微信或其他应用。"; }
      setHint(shareHint);
      btnReEdit.hidden=false; btnHome.hidden=false;
      if(videoTapHint) videoTapHint.hidden=false;
      if(isAppBridge){
        setHint("");
        btnSendWeChat.hidden=false; btnSendWeChat.disabled=true; btnSendWeChat.textContent="发给微信好友";
        if(nativeVideoPath){
          handoffToNative();
        } else {
          setStatus("视频已生成，但无法准备发送，请保存后从微信发送。", "err");
          document.documentElement.classList.add("show-save-fallback");
        }
      }
      if(!isAndroid && !isWeChat && canShareFile){
        btnSend.hidden=false;
      }
    } catch(err){
      if(myToken !== genToken) return;
      var timedOut = !!(activeController && activeController.signal.aborted && cancelReason !== "user");
      console.error("generate error:", err);
      generatePhase = timedOut ? "timeout" : "error";
      if(cancelReason === "user"){
        // 用户主动修改文字/切换情绪：静默取消，不弹错误
      } else if(timedOut){
        setStatus("生成时间有点久，请再试一次。", "err");
        showToast("生成时间有点久，请再试一次。");
      } else if(err && err.backendMessage){
        setStatus(err.backendMessage, "err");
        showToast(err.backendMessage);
      } else {
        setStatus("视频生成失败，请重试", "err");
        showToast("视频生成失败，请重试");
      }
    } finally {
      if(myToken !== genToken) return;
      resetGenerateState();
    }
  }

  function openVideo(){
    if(!lastUrl){ showToast("请先生成视频"); return; }
    videoEl.hidden=false; videoEl.play && videoEl.play().catch(function(){});
    setHint("可直接在上方播放查看；如需发送，请保存到手机后从微信选择该视频。");
  }

  function downloadBlob(blob, name){
    var u=URL.createObjectURL(blob);
    var a=document.createElement("a"); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  function saveVideo(){
    if(!lastBlob){ showToast("请先生成视频"); return; }
    downloadBlob(lastBlob, "七星使者-" + current.name + ".mp4");
    if(isIOS){
      setStatus("");
      setHint("打开后，点击右上角‘…’即可分享");
    } else {
      setStatus("视频已保存", "ok");
      setHint("已保存到手机；若找不到，可在浏览器下载记录中打开。");
    }
  }

  function sendVideo(){
    if(!lastFile){ showToast("请先生成视频"); return; }
    if(navigator.canShare && navigator.canShare({files:[lastFile]})){
      if(isAndroid) setStatus("正在打开系统分享…");
      navigator.share({ files:[lastFile], title:"情绪表达", text:textInput.value }).then(function(){
        setStatus("已调起系统分享", "ok");
      }).catch(function(e){
        console.error("share error:", e);
        if(isAndroid && e && e.name === "AbortError"){
          setStatus("视频已生成", "ok");
          setHint("已取消发送，可再次点击“发给TA”。");
        } else if(isIOS && e && e.name === "AbortError"){
          setStatus("视频已生成", "ok");
          setHint("已取消分享，可再次点击“发给TA”。");
        } else {
          setStatus("分享失败", "err");
          setHint("请重试");
        }
      });
    } else {
      setStatus("当前浏览器不支持直接发送视频文件", "err");
      setHint("请点“保存到手机”后从微信发送。");
    }
  }

  btnSuggest.addEventListener("click", function(){
    if(suggestBox.hidden){
      renderSuggest();
      suggestBox.hidden = false;
    } else {
      suggestBox.hidden = true;
    }
  });

  btnPreviewVoice.addEventListener("click", previewVoice);
  btnGenerate.addEventListener("click", generateVideo);
  btnOpen.addEventListener("click", openVideo);
  btnSave.addEventListener("click", saveVideo);
  btnSend.addEventListener("click", sendVideo);
  btnReEdit.addEventListener("click", reEdit);
  btnHome.addEventListener("click", function(){ location.href = "index.html"; });
  videoEl.addEventListener("click", function(){
    if(videoEl.paused){ videoEl.play().catch(function(){}); } else { videoEl.pause(); }
  });
  btnSendWeChat.addEventListener("click", function(){
    if(!nativeReady){ setStatus("视频正在准备，请稍候…", ""); return; }
    try { window.AndroidShare.sharePreparedVideo(); } catch(err){ setStatus("无法打开系统分享，请重试", "err"); }
    renderBridgeDiag();
  });

  document.addEventListener("click", function(e){
    var el = document.elementFromPoint(e.clientX, e.clientY);
    var desc = el ? (el.tagName + "." + (typeof el.className === "string" ? el.className : "").split(" ")[0]) : "null";
    if(tapDiagEl) tapDiagEl.innerHTML = "点击命中: " + desc;
  }, true);

  refreshUI();
  loadSheets();
  renderDiag();
  renderBridgeDiag();
  renderPreloadDiag();
  renderGuide();
  updateCharCount();
  syncGenerateEnabled();
};

if (window.__MAIN_PENDING__) {
  window.__MAIN_PENDING__ = false;
  window.__MAIN__();
}
</script>
</body>
</html>
