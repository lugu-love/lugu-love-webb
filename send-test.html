<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c18">
<title>情绪表达 · 发送测试</title>
<style>
  :root { --bg:#0b0c18; --card:#17192e; --ink:#eef0ff; --muted:#9aa0c3; --accent:#7d8bff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; padding:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
    -webkit-font-smoothing:antialiased; overflow:hidden; }
  .app { display:flex; flex-direction:column; height:100dvh; padding:calc(env(safe-area-inset-top,0px)+14px) 16px calc(env(safe-area-inset-bottom,0px)+14px); }
  header h1 { font-size:20px; margin:0; }
  header p { font-size:12px; color:var(--muted); margin:4px 0 0; }
  .emotions { display:flex; gap:8px; margin:14px 0 4px; }
  .emotion { flex:1; padding:10px 0; border-radius:14px; border:1px solid rgba(255,255,255,.12); background:var(--card); color:var(--muted); font-size:14px; cursor:pointer; text-align:center; }
  .emotion.active { color:#fff; border-color:var(--accent); background:rgba(125,139,255,.16); }
  .stage-wrap { flex:1; display:flex; align-items:center; justify-content:center; min-height:0; }
  #stage { width:min(88vw,430px); height:auto; border-radius:18px; }
  .preview-text { text-align:center; font-size:17px; line-height:1.6; min-height:28px; margin:8px 0 4px; white-space:pre-wrap; color:#fff; }
  .editor textarea { width:100%; min-height:74px; border-radius:14px; background:var(--card); color:var(--ink); border:1px solid rgba(255,255,255,.12); padding:12px; font-size:15px; line-height:1.5; resize:none; outline:none; }
  .editor textarea:focus { border-color:var(--accent); }
  .progress { min-height:20px; margin:8px 0 0; text-align:center; font-size:13px; color:#ffd47f; }
  .actions { display:flex; gap:10px; margin-top:12px; }
  button { flex:1; height:48px; border-radius:14px; border:none; font-size:16px; font-weight:650; cursor:pointer; }
  .btn-send { background:linear-gradient(135deg,#7d8bff,#a06bff); color:#fff; }
  .btn-save { background:rgba(255,255,255,.08); color:var(--ink); border:1px solid rgba(255,255,255,.14); }
  button:disabled { opacity:.55; }
  .toast { position:fixed; left:50%; bottom:96px; transform:translateX(-50%); z-index:9; padding:9px 14px; border-radius:999px; background:rgba(20,22,40,.88); border:1px solid rgba(255,255,255,.16); color:#fff; font-size:12px; opacity:0; transition:opacity .25s; max-width:80vw; text-align:center; }
  .toast.show { opacity:1; }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>情绪表达 · 发送测试</h1>
      <p>选择情绪 → 写一句话 → 生成视频 → 发送</p>
    </header>

    <div class="emotions" id="emotions"></div>
    <div class="stage-wrap"><canvas id="stage" width="540" height="540"></canvas></div>
    <div class="preview-text" id="previewText"></div>
    <div class="editor"><textarea id="textInput" maxlength="40" placeholder="写一句话…"></textarea></div>
    <div class="progress" id="progress"></div>

    <div class="actions">
      <button class="btn-save" id="btnSave" type="button" hidden>保存视频</button>
      <button class="btn-send" id="btnSend" type="button">生成并发送</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>

<script>
(function () {
  var MAKE_SEND_API = "https://pat-naturally-zero-stolen.trycloudflare.com";

  var EMOTIONS = [
    { id:"1", name:"开心", item:"rabbit-happy", totalFrames:73, sheetCount:7 },
    { id:"2", name:"委屈", item:"rabbit-aggrieved", totalFrames:91, sheetCount:8 },
    { id:"3", name:"生气", item:"rabbit-angry", totalFrames:109, sheetCount:10 }
  ];

  var FRAME_SIZE=540, FRAMES_PER_SHEET=12, COLS=4, FRAME_RATE=18;
  var RENDER_SIZE=375, RENDER_X=Math.round((540-RENDER_SIZE)/2), RENDER_Y=69;

  var canvas=document.getElementById("stage"), ctx=canvas.getContext("2d");
  var emotionsEl=document.getElementById("emotions");
  var textInput=document.getElementById("textInput");
  var previewTextEl=document.getElementById("previewText");
  var progressEl=document.getElementById("progress");
  var btnSend=document.getElementById("btnSend");
  var btnSave=document.getElementById("btnSave");
  var toastEl=document.getElementById("toast");

  var current=EMOTIONS[0];
  var sheets=[], loaded=0, frameIndex=0, lastFrameAt=0, animId=null;
  var lastFileUrl=null, lastFile=null;

  EMOTIONS.forEach(function(e){
    var b=document.createElement("button"); b.type="button"; b.className="emotion"; b.textContent=e.name;
    b.addEventListener("click", function(){ selectEmotion(e.id); });
    emotionsEl.appendChild(b);
  });

  function refreshUI(){ Array.prototype.forEach.call(emotionsEl.children, function(b,i){ b.classList.toggle("active", EMOTIONS[i].id===current.id); }); }

  function selectEmotion(id){
    current = EMOTIONS.find(function(e){return e.id===id;}) || EMOTIONS[0];
    refreshUI(); loadSheets();
  }

  function basePath(){ return "assets/video/fengxin-rabbit-sequence/" + current.id + "/"; }
  function loadSheets(){
    cancelAnimationFrame(animId); sheets=[]; loaded=0;
    for(var i=0;i<current.sheetCount;i++){
      (function(i){ var im=new Image(); im.onload=function(){ loaded++; if(loaded===current.sheetCount) startLoop(); }; im.src=basePath()+"sheet-"+String(i).padStart(2,"0")+".webp"; sheets.push(im); })(i);
    }
  }
  function paintFrame(){
    var sheetIndex=Math.floor(frameIndex/FRAMES_PER_SHEET), local=frameIndex%FRAMES_PER_SHEET;
    var sx=(local%COLS)*FRAME_SIZE, sy=Math.floor(local/COLS)*FRAME_SIZE;
    ctx.clearRect(0,0,540,540); var img=sheets[sheetIndex];
    if(img&&img.complete) ctx.drawImage(img,sx,sy,FRAME_SIZE,FRAME_SIZE,RENDER_X,RENDER_Y,RENDER_SIZE,RENDER_SIZE);
  }
  function startLoop(){ frameIndex=0; lastFrameAt=0; paintFrame(); cancelAnimationFrame(animId); animId=requestAnimationFrame(loop); }
  function loop(now){ if(!lastFrameAt) lastFrameAt=now; if(now-lastFrameAt>=1000/FRAME_RATE){ lastFrameAt=now; frameIndex=(frameIndex+1)%current.totalFrames; paintFrame(); } animId=requestAnimationFrame(loop); }

  textInput.addEventListener("input", function(){ previewTextEl.textContent=textInput.value; });

  function showToast(msg){ toastEl.textContent=msg; toastEl.classList.add("show"); clearTimeout(showToast._t); showToast._t=setTimeout(function(){toastEl.classList.remove("show");},1800); }

  function setProgress(msg){ progressEl.textContent=msg; }
  function setBusy(busy){ btnSend.disabled=busy; btnSend.textContent = busy ? "生成中…" : "生成并发送"; }

  function downloadFile(blob, name){
    if(lastFileUrl) URL.revokeObjectURL(lastFileUrl);
    lastFileUrl=URL.createObjectURL(blob);
    var a=document.createElement("a"); a.href=lastFileUrl; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(lastFileUrl); }, 60000);
  }

  function saveVideo(){
    if(!lastFile){ showToast("请先生成视频"); return; }
    downloadFile(lastFile, "七星使者-" + current.name + ".mp4");
    showToast("已保存视频，保存后可从微信发送给好友");
  }

  async function generateAndSend(){
    var text=(textInput.value||"").trim();
    if(!text){ showToast("请先写一句话"); return; }

    setBusy(true); btnSave.hidden=true;
    var msgs=["正在生成你的情绪视频…","正在加入你的文字…","正在生成声音…","视频马上好了…"];
    var mi=0; setProgress(msgs[0]);
    var timer=setInterval(function(){ mi=(mi+1)%msgs.length; setProgress(msgs[mi]); }, 2600);

    try{
      var url=MAKE_SEND_API + "/make-send?text=" + encodeURIComponent(text) + "&item=" + encodeURIComponent(current.item);
      var resp=await fetch(url, { cache:"no-store" });
      if(!resp.ok) throw new Error("HTTP "+resp.status);
      var blob=await resp.blob();
      if(!blob || blob.size===0) throw new Error("empty");
      var file=new File([blob], "七星使者-" + current.name + ".mp4", { type:"video/mp4" });
      lastFile=blob;

      if(navigator.canShare && navigator.canShare({files:[file]})){
        setProgress("已生成，正在打开系统分享…");
        await navigator.share({ files:[file], title:"情绪表达", text:text });
        setProgress("已调起系统分享，请选择微信");
      } else {
        setProgress("当前浏览器不支持直接发送视频文件，请点“保存视频”");
        btnSave.hidden=false;
      }
    } catch(err){
      setProgress("生成或分享失败，请重试");
      showToast("生成失败，请重试");
    } finally {
      clearInterval(timer);
      setBusy(false);
    }
  }

  btnSend.addEventListener("click", generateAndSend);
  btnSave.addEventListener("click", saveVideo);

  refreshUI();
  loadSheets();
})();
</script>
</body>
</html>
