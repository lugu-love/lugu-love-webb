<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="lugu-candidate-name" content="candidate-20260930-frontstage-player-v1-r1">
  <meta name="lugu-baseline-commit" content="b8308838b961ace9d281fd78c542ccfa496b5cdf">
  <meta name="theme-color" content="#080912">
  <title>Frontstage Player V1 · 风信兔</title>
  <link rel="stylesheet" href="frontstage-player.css?v=20260930-a1">
</head>
<body>
  <main id="player-root" aria-label="七星使者前场播放器"></main>
  <script type="module">
    import { FrontstagePlayer, PLAYER_STATES } from "./frontstage-player.js?v=20260930-a1";
    import { DEFAULT_ITEM_ID, getRegisteredItem } from "./frontstage-registry.js?v=20260930-a1";

    async function main() {
      const params = new URLSearchParams(location.search);
      const itemId = params.get("item") || DEFAULT_ITEM_ID;
      const autoOpen = params.get("auto") === "1";
      const autoCycles = Math.max(1, Number.parseInt(params.get("cycles") || "1", 10) || 1);
      const item = await getRegisteredItem(itemId);
      const root = document.getElementById("player-root");
      const player = new FrontstagePlayer(root, item, { autoOpen, autoCycles });

      window.__frontstagePlayer = player;
      window.__frontstageMeta = {
        candidateName: "candidate-20260930-frontstage-player-v1-r1",
        baselineCommit: "b8308838b961ace9d281fd78c542ccfa496b5cdf",
        playerVersion: "frontstage-player-v1",
        itemId
      };

      player.addEventListener("statechange", (event) => {
        document.documentElement.dataset.playerState = event.detail.to;
        document.documentElement.dataset.playerCycle = String(event.detail.cycle);
      });
      player.addEventListener("playererror", () => {
        document.documentElement.dataset.playerError = "1";
      });

      document.documentElement.dataset.playerState = PLAYER_STATES.INIT;
      player.start();
    }

    main().catch((error) => {
      document.documentElement.dataset.playerError = "1";
      document.getElementById("player-root").textContent = "Player 初始化失败：" + error.message;
      console.error(error);
    });
  </script>
</body>
</html>
