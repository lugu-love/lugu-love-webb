<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>心域音乐库 Candidate</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 50% 20%, #27395d 0, #101827 48%, #080d16 100%); color: #f5f7fb; }
    main { width: min(92vw, 560px); padding: 28px; border: 1px solid rgba(255,255,255,.14); border-radius: 24px; background: rgba(11,18,31,.82); box-shadow: 0 24px 70px rgba(0,0,0,.38); }
    h1 { margin: 0 0 8px; font-size: 1.45rem; }
    .meta { color: #9fb0cb; font-size: .9rem; line-height: 1.5; overflow-wrap: anywhere; }
    .title { margin: 22px 0 6px; font-size: 1.2rem; font-weight: 650; }
    .id { color: #8fb8ff; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .status { min-height: 1.5em; margin-top: 14px; color: #b9c6da; font-size: .9rem; }
    audio { width: 100%; margin-top: 16px; }
    .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; margin-top: 16px; }
    button { min-height: 46px; border: 1px solid rgba(255,255,255,.15); border-radius: 13px; background: #1c2a46; color: #fff; font: inherit; cursor: pointer; }
    button:active { transform: translateY(1px); }
    button:disabled { cursor: wait; opacity: .5; }
    @media (max-width: 430px) { main { padding: 22px; } .buttons { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <main>
    <h1>心域音乐库 Candidate</h1>
    <div class="meta" id="meta">正在读取 manifest…</div>
    <div class="title" id="title">—</div>
    <div class="id" id="trackId">—</div>
    <audio id="audio" controls preload="metadata"></audio>
    <div class="buttons">
      <button id="prev" type="button">上一首</button>
      <button id="play" type="button">播放</button>
      <button id="next" type="button">下一首</button>
      <button id="random" type="button">随机</button>
    </div>
    <div class="status" id="status" role="status"></div>
  </main>

  <script>
    (() => {
      const manifestUrl = "../../catalog/v1/manifest.json";
      const context = "earthRandom";
      const audio = document.getElementById("audio");
      const title = document.getElementById("title");
      const trackId = document.getElementById("trackId");
      const meta = document.getElementById("meta");
      const status = document.getElementById("status");
      const buttons = {
        prev: document.getElementById("prev"),
        play: document.getElementById("play"),
        next: document.getElementById("next"),
        random: document.getElementById("random"),
      };
      let tracks = [];
      let index = -1;

      function isEligible(track) {
        return track?.status === "active" &&
          track?.license?.status === "verified" &&
          track?.contexts?.[context] === true &&
          typeof track?.url === "string" && track.url;
      }

      function show(indexToShow, autoplay = false) {
        if (!tracks.length) return;
        index = (indexToShow + tracks.length) % tracks.length;
        const track = tracks[index];
        audio.pause();
        audio.src = track.url;
        audio.load();
        title.textContent = track.title;
        trackId.textContent = track.id;
        status.textContent = `${index + 1} / ${tracks.length} · ${track.mimeType || "audio"}`;
        if (autoplay) {
          audio.play().catch((error) => {
            status.textContent = `播放失败：${error.name}`;
          });
        }
      }

      function randomIndex() {
        if (tracks.length < 2) return 0;
        let next = index;
        while (next === index) next = Math.floor(Math.random() * tracks.length);
        return next;
      }

      buttons.prev.addEventListener("click", () => show(index - 1, true));
      buttons.next.addEventListener("click", () => show(index + 1, true));
      buttons.random.addEventListener("click", () => show(randomIndex(), true));
      buttons.play.addEventListener("click", () => {
        if (audio.paused) {
          audio.play().catch((error) => {
            status.textContent = `播放失败：${error.name}`;
          });
        } else {
          audio.pause();
        }
      });
      audio.addEventListener("play", () => { buttons.play.textContent = "暂停"; });
      audio.addEventListener("pause", () => { buttons.play.textContent = "播放"; });
      audio.addEventListener("error", () => {
        status.textContent = "音频加载失败";
      });

      Object.values(buttons).forEach((button) => { button.disabled = true; });
      fetch(manifestUrl, { cache: "no-store" })
        .then((response) => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        })
        .then((manifest) => {
          tracks = (manifest.tracks || [])
            .filter(isEligible)
            .sort((a, b) => a.id.localeCompare(b.id));
          if (!tracks.length) throw new Error("没有符合播放资格的曲目");
          meta.textContent = `manifest: ${manifest.catalogVersion} · 可播放 ${tracks.length} 首`;
          Object.values(buttons).forEach((button) => { button.disabled = false; });
          show(0, false);
        })
        .catch((error) => {
          meta.textContent = "manifest 读取失败";
          status.textContent = error.message;
        });
    })();
  </script>
</body>
</html>
