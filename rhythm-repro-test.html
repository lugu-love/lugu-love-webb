<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>节奏匹配可复制性验证</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { min-height:100dvh; background:#020407; color:#fff; font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif; padding:22px 16px 40px; }
  h1 { font-size:17px; font-weight:600; text-align:center; }
  .sub { font-size:12px; color:rgba(255,255,255,.55); text-align:center; margin:6px 0 18px; }
  .grp { margin-bottom:24px; padding:14px; border:1px solid rgba(255,255,255,.12); border-radius:14px; }
  .grp-title { font-size:15px; font-weight:650; margin-bottom:10px; }
  .item { margin-bottom:16px; }
  .label { font-size:13px; font-weight:600; margin-bottom:6px; }
  .label .ok { color:#7ce0a0; } .label .bad { color:#ff9aa6; }
  .label small { color:rgba(255,255,255,.5); font-weight:400; }
  video { width:100%; max-width:360px; display:block; margin:0 auto; border-radius:12px; background:#000; }
  a.back { display:inline-flex; align-items:center; gap:6px; padding:9px 16px; border:1px solid rgba(255,255,255,.24); border-radius:12px; background:rgba(255,255,255,.08); color:#fff; text-decoration:none; font-size:13px; }
  .back-wrap { text-align:center; margin-top:8px; }
</style>
</head>
<body>
<h1>节奏匹配可复制性验证</h1>
<p class="sub">三条不同源 · 各一条「节奏匹配版 A」vs「故意不匹配版 B」</p>

<div class="grp">
  <div class="grp-title">源 1 · 01 开心</div>
  <div class="item"><div class="label"><span class="ok">A 匹配</span> <small>13字 / 3.0s</small></div><video src="assets/video/rhythm-happy_A.mp4" controls playsinline preload="metadata"></video></div>
  <div class="item"><div class="label"><span class="bad">B 不匹配</span> <small>30字 / 8.7s</small></div><video src="assets/video/rhythm-happy_B.mp4" controls playsinline preload="metadata"></video></div>
</div>

<div class="grp">
  <div class="grp-title">源 2 · 02 委屈难过</div>
  <div class="item"><div class="label"><span class="ok">A 匹配</span> <small>14字 / 4.9s</small></div><video src="assets/video/rhythm-wronged_A.mp4" controls playsinline preload="metadata"></video></div>
  <div class="item"><div class="label"><span class="bad">B 不匹配</span> <small>30字 / 9.3s</small></div><video src="assets/video/rhythm-wronged_B.mp4" controls playsinline preload="metadata"></video></div>
</div>

<div class="grp">
  <div class="grp-title">源 3 · 05 调皮幽默</div>
  <div class="item"><div class="label"><span class="ok">A 匹配</span> <small>15字 / 4.0s</small></div><video src="assets/video/rhythm-playful_A.mp4" controls playsinline preload="metadata"></video></div>
  <div class="item"><div class="label"><span class="bad">B 不匹配</span> <small>26字 / 7.1s</small></div><video src="assets/video/rhythm-playful_B.mp4" controls playsinline preload="metadata"></video></div>
</div>

<div class="back-wrap"><a class="back" href="index.html">← 返回</a></div>
</body>
</html>
