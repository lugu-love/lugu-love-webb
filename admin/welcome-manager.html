<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>欢迎语管理</title>
<style>
  :root { --bg:#0b0c18; --card:#17192e; --ink:#eef0ff; --muted:#9aa0c3; --accent:#7d8bff; --err:#ff9aa6; --ok:#a9e3a0; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif; padding:20px; }
  .wrap { max-width:720px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 16px; }
  .box { background:var(--card); border-radius:14px; padding:16px; margin-bottom:14px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
  input[type=text], input[type=password] { flex:1; min-width:120px; background:#12142a; color:#fff; border:1px solid rgba(255,255,255,.12); border-radius:10px; padding:10px 12px; font-size:14px; }
  button { background:rgba(125,139,255,.18); color:#fff; border:1px solid rgba(125,139,255,.30); border-radius:10px; padding:9px 14px; font-size:14px; cursor:pointer; }
  button.primary { background:linear-gradient(135deg,#7d8bff,#a06bff); border:none; }
  button.ghost { background:rgba(255,255,255,.06); border-color:rgba(255,255,255,.14); }
  button:disabled { opacity:.55; cursor:default; }
  .msg { display:flex; gap:8px; align-items:center; border:1px solid rgba(255,255,255,.08); border-radius:10px; padding:10px; margin-bottom:8px; }
  .msg input[type=text] { flex:1; min-width:0; }
  .msg .idx { color:var(--muted); font-size:12px; width:26px; text-align:right; }
  .msg .cur { color:var(--accent); font-size:12px; white-space:nowrap; }
  .msg label { color:var(--muted); font-size:13px; white-space:nowrap; display:inline-flex; align-items:center; gap:4px; }
  .status { min-height:18px; font-size:13px; margin-top:6px; }
  .status.ok { color:var(--ok); }
  .status.err { color:var(--err); }
  .resolved { color:var(--muted); font-size:13px; margin-top:4px; }
  .mode { font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>欢迎语管理</h1>

  <div class="box" id="loginBox">
    <div class="row">
      <input type="password" id="pwd" placeholder="管理密码">
      <button class="primary" id="btnLogin" type="button">登录</button>
    </div>
    <div class="status" id="loginErr"></div>
  </div>

  <div id="managerBox" style="display:none">
    <div class="box">
      <div class="row">
        <span class="mode">模式：<b id="modeLabel">auto</b></span>
        <button class="ghost" id="btnAuto" type="button">恢复每日自动轮换</button>
        <button class="primary" id="btnSave" type="button">保存</button>
      </div>
      <div class="row">
        <input type="text" id="newText" placeholder="新增一句欢迎语">
        <button id="btnAdd" type="button">新增</button>
      </div>
    </div>

    <div class="box" id="listBox"></div>

    <div class="box">
      <div class="resolved">当前显示：<span id="resolvedText">—</span></div>
      <div class="status" id="status"></div>
    </div>
  </div>
</div>

<script>
(function () {
  var API = "https://api.lugu.love";
  var token = localStorage.getItem("welcome_admin_token") || "";
  var cfg = null;

  var $ = function (id) { return document.getElementById(id); };
  function setStatus(msg, cls) { var el = $("status"); el.textContent = msg || ""; el.className = "status" + (cls ? " " + cls : ""); }
  function setLoginErr(msg) { var el = $("loginErr"); el.textContent = msg || ""; el.className = "status" + (msg ? " err" : ""); }

  function showManager() {
    $("loginBox").style.display = "none";
    $("managerBox").style.display = "";
  }
  function showLogin() {
    $("loginBox").style.display = "";
    $("managerBox").style.display = "none";
  }

  function newId() { return "w" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  function render() {
    var box = $("listBox");
    box.innerHTML = "";
    var list = (cfg && cfg.messages) || [];
    list.forEach(function (m, i) {
      var div = document.createElement("div");
      div.className = "msg";
      var idx = document.createElement("span");
      idx.className = "idx";
      idx.textContent = String(i + 1);
      var text = document.createElement("input");
      text.type = "text";
      text.value = m.text;
      text.addEventListener("input", function () { m.text = text.value; });
      var en = document.createElement("label");
      var cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = !!m.enabled;
      cb.addEventListener("change", function () { m.enabled = cb.checked; });
      en.appendChild(cb);
      en.appendChild(document.createTextNode("启用"));
      var cur = document.createElement("span");
      cur.className = "cur";
      if (cfg.mode === "manual" && cfg.activeId === m.id) cur.textContent = "当前使用";
      var up = document.createElement("button");
      up.type = "button"; up.textContent = "↑"; up.className = "ghost";
      up.disabled = i === 0;
      up.addEventListener("click", function () { list.splice(i - 1, 0, list.splice(i, 1)[0]); normalizeOrder(); render(); });
      var down = document.createElement("button");
      down.type = "button"; down.textContent = "↓"; down.className = "ghost";
      down.disabled = i === list.length - 1;
      down.addEventListener("click", function () { list.splice(i + 1, 0, list.splice(i, 1)[0]); normalizeOrder(); render(); });
      var setCur = document.createElement("button");
      setCur.type = "button"; setCur.textContent = "设为当前"; setCur.className = "ghost";
      setCur.addEventListener("click", function () { cfg.mode = "manual"; cfg.activeId = m.id; $("modeLabel").textContent = "manual"; render(); });
      div.appendChild(idx); div.appendChild(text); div.appendChild(en); div.appendChild(cur); div.appendChild(up); div.appendChild(down); div.appendChild(setCur);
      box.appendChild(div);
    });
    $("modeLabel").textContent = cfg.mode || "auto";
  }

  function normalizeOrder() {
    (cfg.messages || []).forEach(function (m, i) { m.order = i + 1; });
  }

  function loadConfig() {
    fetch(API + "/welcome", { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (d) {
        cfg = JSON.parse(JSON.stringify(d.config));
        $("resolvedText").textContent = (d.resolved && d.resolved.text) || "—";
        render();
      })
      .catch(function (e) { setStatus("加载失败：" + e.message, "err"); });
  }

  function save() {
    if (!cfg) return;
    setStatus("保存中…");
    fetch(API + "/welcome/admin", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify(cfg)
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (x) {
        if (!x.ok) { setStatus(x.d && x.d.error ? x.d.error : "保存失败", "err"); return; }
        cfg = x.d.config;
        $("resolvedText").textContent = (x.d.resolved && x.d.resolved.text) || "—";
        setStatus("已保存", "ok");
        render();
      })
      .catch(function (e) { setStatus("保存失败：" + e.message, "err"); });
  }

  $("btnLogin").addEventListener("click", function () {
    var pw = $("pwd").value;
    if (!pw) { setLoginErr("请输入密码"); return; }
    fetch(API + "/admin/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: pw })
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (x) {
        if (!x.ok) { setLoginErr(x.d && x.d.error ? x.d.error : "登录失败"); return; }
        token = x.d.token;
        localStorage.setItem("welcome_admin_token", token);
        setLoginErr("");
        $("pwd").value = "";
        showManager();
        loadConfig();
      })
      .catch(function (e) { setLoginErr("登录失败：" + e.message); });
  });

  $("btnAdd").addEventListener("click", function () {
    var t = $("newText").value.trim();
    if (!t) return;
    cfg.messages = cfg.messages || [];
    cfg.messages.push({ id: newId(), text: t, enabled: true, order: cfg.messages.length + 1 });
    $("newText").value = "";
    render();
  });

  $("btnAuto").addEventListener("click", function () {
    cfg.mode = "auto";
    cfg.activeId = null;
    render();
  });

  $("btnSave").addEventListener("click", save);

  if (token) { showManager(); loadConfig(); }
})();
</script>
</body>
</html>
