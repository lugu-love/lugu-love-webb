     3) 在 head 阶段并行启动正式契约（build.json + asset-manifest.json），

  function getJson(url) {
    var request;
    try {
      request = fetch(url, { cache: "no-store" }).then(function (response) {
        if (!response.ok) throw new Error(url + " " + response.status);
        return response.json();
      });
    } catch (error) {
      request = Promise.reject(error);
    }

  /* ---- 统一自定义下拉箭头（不依赖 iOS / Android / 桌面原生箭头）----

    setActiveViewText(value);            // 只写入「当前正在编辑的那一份」
    suppressInputTracking = false;
    if(editorView===EDITOR_VIEW_DIALECT){
      dialectText = value || "";
      if(dialectStatus!=="converted" && dialectStatus!=="userEdited") dialectStatus = "userEdited";
    } else {
      textState = state || TEXT_EDITED;
      textInput.dataset.originalText = value || "";
      if(!skipRev) originalRev++;          // 原文确实变了 → 修订号 +1，供「需要重新转换」判定
      if(dialectText && dialectConvertedFromRev!==originalRev) dialectStatus="needReconvert";
    }
    // 结果页展示的是「原文字幕」——永远显示原文
    previewTextEl.textContent = originalText();
    invalidatePreviewToken();
    syncDialectWithOriginal();
    updateCharCount();
    syncGenerateEnabled();
    invalidateGeneratedResult();
    refreshDialectTip();
    saveDraftNow();
  }
  function clearTextWithUndo(){
    // 清空只作用于「当前正在编辑的版本」，不无提示删除另一版本
    var prev = textInput.value;
    var clearedView = editorView;
    if (!prev) { showToast(clearedView===EDITOR_VIEW_DIALECT ? "方言稿本来就是空的" : "还没有可清空的内容"); return; }
    if (unfavUndoHideTimer) { clearTimeout(unfavUndoHideTimer); unfavUndoHideTimer = 0; }
    pendingUnfavorite = null;
    undoPayload = { text: prev, textState: textState, view: clearedView };
    if (csAlive()) CS.setRecentUndo({ kind: "clear", text: prev, textState: textState, view: clearedView });   // 刷新前也保留最近一次可撤销内容
    if (clearedView === EDITOR_VIEW_DIALECT) {
      dialectText = "";
      dialectDirty = true;
      dialectStatus = "unconverted";
      applyText("", TEXT_EDITED);
    } else {
      textState = TEXT_UNTOUCHED;
      applyText("", TEXT_UNTOUCHED);
    }
    showUndoBar();
    showToast(clearedView===EDITOR_VIEW_DIALECT ? "已清空方言口语稿" : "已清空");
  }
  function showUndoBar(){
    if (!undoBar) return;
    undoBar.classList.add("show");
    if (undoHideTimer) clearTimeout(undoHideTimer);
    undoHideTimer = setTimeout(function(){ undoBar.classList.remove("show"); undoHideTimer = 0; }, 8000);
  }
  function hideUndoBar(){
    if (!undoBar) return;
    undoBar.classList.remove("show");
    if (undoHideTimer) { clearTimeout(undoHideTimer); undoHideTimer = 0; }
  }
  function undoClear(){
    var payload = undoPayload;
    if ((!payload || !payload.text) && csAlive()) {
      var stored = null;
      try { stored = CS.getRecentUndo(); } catch (e) { stored = null; }
      if (stored && stored.kind !== "unfavorite" && stored.text) payload = stored;
    }
    if (!payload || !payload.text) { showToast("没有可撤销的清空"); return; }
    // 撤销回到被清空时所在的那个视图
    if (payload.view && payload.view !== editorView) {
      captureActiveView();
      editorView = payload.view;
      renderEditorView();
    }
    applyText(payload.text, payload.textState || TEXT_EDITED);
    if (csAlive()) CS.clearRecentUndo();
    undoPayload = null;
    hideUndoBar();
  }
  function toggleFavoriteCurrent(){
    var text = (textInput.value || "").trim();
    if (!text) { showToast("请先写一句话"); return; }
    if (!csAlive()) { showToast("本机内容暂不可用"); return; }
    var payload = currentDraftPayload();
    var before = CS.findFavoriteByText(text);          // 取消收藏前先留一份，用于撤销
    var result = CS.toggleFavorite(payload);
    updateFavButtons();
    showToast(result.favorited ? "已收藏" : "已取消收藏");
    if (!result.favorited) scheduleUndoUnfavorite(before || payload, "已取消收藏 ");
  }
  function isCurrentFavorite(){
    if (!csAlive()) return false;
    var text = (textInput.value || "").trim();
    return !!text && CS.isFavoriteText(text);
  }
  function updateFavButtons(){
    var on = isCurrentFavorite();
    if (btnFavText) { btnFavText.classList.toggle("fav-on", on); btnFavText.setAttribute("aria-pressed", on ? "true" : "false"); }
    if (favHeartIcon) favHeartIcon.textContent = on ? HEART_FILLED : HEART_OUTLINE;
    if (suggestBox) {
      Array.prototype.forEach.call(suggestBox.querySelectorAll(".suggest-chip"), function (chip) {
        var fav = !!(CS && chip.dataset && chip.dataset.suggestText && CS.isFavoriteText(chip.dataset.suggestText));
        var heart = chip.querySelector(".suggest-fav");
        if (heart) { heart.textContent = fav ? HEART_FILLED : HEART_OUTLINE; heart.classList.toggle("on", fav); }
      });
    }
    updateEditorActions();
    renderContentList();
  }
  function updateEditorActions(){
    var hasText = textInput.value.length > 0;
    if (btnClearText) btnClearText.disabled = !hasText;
    if (btnFavText) btnFavText.disabled = !hasText;
  }
  // 取消收藏后提供短暂撤销机会（轻提示，不弹确认框）
  function scheduleUndoUnfavorite(entry, label){
    if (!entry) return;
    var payload = (entry && typeof entry === "object") ? entry : { text: String(entry) };
    pendingUnfavorite = payload;
    // 写进统一存储层：刷新 / 重新打开后仍然可以撤销
    if (csAlive()) { try { CS.setRecentUndo({ kind: "unfavorite", entry: payload }); } catch (e) {} }
    if (!undoBar) return;
    undoBar.firstChild.nodeValue = label || "已取消收藏 ";
    undoBar.classList.add("show");
    if (unfavUndoHideTimer) clearTimeout(unfavUndoHideTimer);
    unfavUndoHideTimer = setTimeout(function(){
      undoBar.classList.remove("show");
      undoBar.firstChild.nodeValue = "已清空 ";
      pendingUnfavorite = null;
      unfavUndoHideTimer = 0;
      if (csAlive()) { try { CS.clearRecentUndo(); } catch (e) {} }
    }, 6000);
  }
  function undoUnfavorite(){
    var e = pendingUnfavorite;
    if (!e && csAlive()) {
      var stored = null;
      try { stored = CS.getRecentUndo(); } catch (err) { stored = null; }
      if (stored && stored.kind === "unfavorite") e = stored.entry;
    }
    if (!e) return;
    pendingUnfavorite = null;
    if (unfavUndoHideTimer) { clearTimeout(unfavUndoHideTimer); unfavUndoHideTimer = 0; }
    if (undoBar) { undoBar.classList.remove("show"); undoBar.firstChild.nodeValue = "已清空 "; }
    if (!csAlive()) return;
    try {
      CS.saveFavorite(e);
      showToast("已恢复收藏");
      renderContentList();
      updateFavButtons();
    } catch (err) { showToast("恢复收藏失败"); }
  }
  // 页面重新打开时，如果上一次的「取消收藏」撤销还没过期，把撤销条显示出来
  function restoreUndoBar(){
    if (!csAlive() || !undoBar) return;
    var stored = null;
    try { stored = CS.getRecentUndo(); } catch (e) { stored = null; }
    if (!stored) return;
    if (stored.kind === "unfavorite") {
      pendingUnfavorite = stored.entry;
      undoBar.firstChild.nodeValue = "已取消收藏 ";
      undoBar.classList.add("show");
    } else if (stored.kind === "clear" && !textInput.value) {
      undoPayload = stored;
      undoBar.firstChild.nodeValue = "已清空 ";
      undoBar.classList.add("show");
    }
  }

  /* -------- 恢复草稿（刷新 / 重新打开页面） -------- */
  function restoreWorkingDraft(){
    if (!csAlive()) return;
    var w = null;
    try { w = CS.getWorkingDraft(); } catch (e) { w = null; }
    if (!w) { syncPrimaryActions(); return; }
    if (w.textState) textState = w.textState;
    draftId = w.id || "";
    contentVersion = Math.max(0, parseInt(w.contentVersion, 10) || 0);
    savedContentVersion = w.generated && !w.resultStale ? contentVersion : -1;
    currentResultId = w.generateResultId || "";
    resultStale = false;
    if (w.text) {
      // 原文落在 dataset，方言稿与当前视图一起恢复：两份都不丢
      textInput.dataset.originalText = w.originalText || w.text || "";
      dialectText = w.dialectText || "";
      dialectStatus = (w.dialectStatus==="converted"||w.dialectStatus==="userEdited"||w.dialectStatus==="needReconvert") ? w.dialectStatus : "unconverted";
      dialectDirty = !!w.dialectDirty;
      editorView = (w.activeTextView===EDITOR_VIEW_DIALECT) ? EDITOR_VIEW_DIALECT : EDITOR_VIEW_ORIGINAL;
      originalRev = Math.max(0, parseInt(w.originalRev,10) || 0);
      dialectRev = Math.max(0, parseInt(w.dialectRev,10) || 0);
      dialectConvertedFromRev = Math.max(0, parseInt(w.dialectConvertedFromRev,10) || 0);
      renderEditorView();
      previewTextEl.textContent = textInput.dataset.originalText || "";
    }
    // 1) 使者：只接受白名单内、且当前确实有素材的使者
    if (w.characterId && characterSelect && w.characterId !== characterSelect.value) {
      if (isCharacterUnlocked(w.characterId) && characterSelectHas(w.characterId)) {
        characterSelect.value = w.characterId;
        switchCharacter(w.characterId);
      }
    }
    // 2) 情绪 / 场景：本页等于情绪；找不到就保留文字并回退到默认情绪
    if (w.emotionId) {
      var emo = EMOTIONS.filter(function (x) { return String(x.id) === String(w.emotionId); })[0];
      if (emo && (!current || String(current.id) !== String(emo.id))) selectEmotion(emo.id);
    }
    // 3) 声音：先恢复普通话 / 方言，再在当前可用音色里找同 id，找不到就用默认
    if (w.voiceScope && voiceScopeSelect && w.voiceScope !== voiceScopeSelect.value) {
      voiceScopeSelect.value = w.voiceScope === "dialect" ? "dialect" : "standard";
      voiceScopeSelect.dispatchEvent(new Event("change", { bubbles: true }));
    }
    if (w.dialectId && dialectSelect && voiceScopeSelect.value === "dialect") {
      dialectSelect.value = w.dialectId;
      dialectSelect.dispatchEvent(new Event("change", { bubbles: true }));
    }
    if (w.voiceId && voiceSelect) {
      var found = Array.prototype.some.call(voiceSelect.options, function (o) { return o.value === w.voiceId; });
      if (found) { voiceSelect.value = w.voiceId; syncWrapLabel(voiceSelect); }
    }
    syncDialectWithOriginal();
    updateCharCount();
    syncGenerateEnabled();
    syncPrimaryActions();
    updateFavButtons();
    updateDraftStatus();
  }

  /* -------- 「我的内容」弹层 -------- */
  function contentLabel(entry){
    var type = entry && entry.contentType === "blessing" ? "祝福" : (entry && entry.contentType === "greeting" ? "问候" : "情绪");
    var emo = null;
    if (entry && entry.emotionId) {
      emo = EMOTIONS.filter(function (x) { return String(x.id) === String(entry.emotionId); })[0];
    }
    return type + (emo ? " · " + emo.name : "");
  }
  function timeLabel(ms){
    var t = parseInt(ms, 10) || 0;
    if (!t) return "";
    var diff = Date.now() - t;
    if (diff < 60000) return "刚刚";
    if (diff < 3600000) return Math.floor(diff / 60000) + " 分钟前";
    if (diff < 86400000) return Math.floor(diff / 3600000) + " 小时前";
    var d = new Date(t);
    return (d.getMonth() + 1) + "月" + d.getDate() + "日";
  }
  function previewOf(entry, max){
    var t = String((entry && entry.text) || "").replace(/\s+/g, " ").trim();
    if (!t) return "（空白草稿）";
    var n = max || 42;
    return t.length > n ? t.slice(0, n) + "…" : t;
  }
  function activeList(){
    if (!csAlive()) return [];
    var filter = { contentType: sheetFilter };
    try {
      if (sheetTab === "favorites") return CS.listFavorites(filter);
      if (sheetTab === "drafts") return CS.listDrafts(filter);
      return CS.listRecent(filter);
    } catch (e) { return []; }
  }
  function renderContentList(){
    if (!contentSheet || contentSheet.hidden) return;
    if (!contentList) return;
    while (contentList.firstChild) contentList.removeChild(contentList.firstChild);
    if (contentSheetTitle) {
      contentSheetTitle.textContent = sheetTab === "favorites" ? "我的收藏" : (sheetTab === "drafts" ? "最近草稿" : "最近使用");
    }
    if (!csAlive()) {
      var err = document.createElement("div");
      err.className = "content-empty";
      err.textContent = "本机内容暂不可用";
      contentList.appendChild(err);
      return;
    }
    var list = activeList();
    if (!list.length) {
      var empty = document.createElement("div");
      empty.className = "content-empty";
      empty.textContent = sheetTab === "favorites" ? "还没有收藏" : (sheetTab === "drafts" ? "还没有草稿" : "还没有最近使用");
      contentList.appendChild(empty);
      return;
    }
    list.forEach(function (entry) {
      var item = document.createElement("div");
      item.className = "content-item";
      var title = document.createElement("p");
      title.className = "content-item-title";
      title.textContent = previewOf(entry);          // 纯文本渲染，绝不执行用户输入
      var meta = document.createElement("p");
      meta.className = "content-item-meta";
      var when = sheetTab === "recent" ? (entry.lastUsedAt || entry.updatedAt) : entry.updatedAt;
      meta.textContent = contentLabel(entry) + " · " + timeLabel(when);
      var actions = document.createElement("div");
      actions.className = "content-item-actions";
      var useLabel = sheetTab === "favorites" ? "使用" : "继续编辑";
      var use = document.createElement("button");
      use.type = "button";
      use.className = "content-act primary";
      use.textContent = useLabel;
      use.addEventListener("click", function () { useContentEntry(entry, sheetTab); });
      actions.appendChild(use);
      if (sheetTab === "favorites") {
        var editBtn = document.createElement("button");
        editBtn.type = "button";
        editBtn.className = "content-act";
        editBtn.textContent = "继续修改";
        editBtn.addEventListener("click", function () { useContentEntry(entry, "favorites"); });
        actions.appendChild(editBtn);
        var unFav = document.createElement("button");
        unFav.type = "button";
        unFav.className = "content-act";
        unFav.textContent = "取消收藏";
        unFav.addEventListener("click", function () {
          CS.removeFavorite(entry.id);
          showToast("已取消收藏");
          scheduleUndoUnfavorite(entry, "已取消收藏 ");
          renderContentList();
          updateFavButtons();
        });
        actions.appendChild(unFav);
      } else if (sheetTab === "recent") {
        var toFav = document.createElement("button");
        toFav.type = "button";
        toFav.className = "content-act";
        toFav.textContent = "收藏";
        toFav.disabled = CS.isFavoriteText(entry.text);
        toFav.addEventListener("click", function () {
          CS.saveFavorite(entry);
          showToast("已收藏");
          renderContentList();
          updateFavButtons();
        });
        actions.appendChild(toFav);
      } else {
        var del = document.createElement("button");
        del.type = "button";
        del.className = "content-act";
        del.textContent = "删除";
        del.addEventListener("click", function () {
          var removed = CS.deleteDraft(entry.id);
          showToast("已删除草稿");
          if (removed && removed.id === draftId) {
            draftId = "";
            applyText("", TEXT_UNTOUCHED);
          }
          renderContentList();
          updateFavButtons();
        });
        actions.appendChild(del);
      }
      item.appendChild(title);
      item.appendChild(meta);
      item.appendChild(actions);
      contentList.appendChild(item);
    });
  }
  function applyContentEntry(entry){
    if (!entry) return;
    if (entry.contentType && entry.contentType !== CONTENT_TYPE) {
      showToast("这条内容的类型与当前页面不一致");
      return;
    }
    draftId = entry.id || "";
    textState = entry.textState || TEXT_EDITED;
    contentVersion = Math.max(0, parseInt(entry.contentVersion, 10) || 0) + 1;
    // 只回填文字与能对上的配置，不自动生成、不自动发送
    if (entry.characterId && characterSelect && entry.characterId !== characterSelect.value) {
      if (isCharacterUnlocked(entry.characterId) && characterSelectHas(entry.characterId)) {
        characterSelect.value = entry.characterId;
        switchCharacter(entry.characterId);
      }
    }
    if (entry.emotionId) {
      var emo = EMOTIONS.filter(function (x) { return String(x.id) === String(entry.emotionId); })[0];
      if (emo) selectEmotion(emo.id);
    }
    if (entry.voiceScope && voiceScopeSelect && entry.voiceScope !== voiceScopeSelect.value) {
      voiceScopeSelect.value = entry.voiceScope === "dialect" ? "dialect" : "standard";
      voiceScopeSelect.dispatchEvent(new Event("change", { bubbles: true }));
    }
    if (entry.voiceId && voiceSelect) {
      var found = Array.prototype.some.call(voiceSelect.options, function (o) { return o.value === entry.voiceId; });
      if (found) { voiceSelect.value = entry.voiceId; syncWrapLabel(voiceSelect); }
    }
    // 恢复这条内容：原文、方言稿、当前视图一并恢复（修订号也还原，避免误判「需要重新转换」）
    editorView = (entry.activeTextView===EDITOR_VIEW_DIALECT && (entry.dialectText||"")) ? EDITOR_VIEW_DIALECT : EDITOR_VIEW_ORIGINAL;
    textInput.dataset.originalText = entry.originalText || entry.text || "";
    dialectText = entry.dialectText || "";
    dialectStatus = (entry.dialectStatus==="converted"||entry.dialectStatus==="userEdited"||entry.dialectStatus==="needReconvert") ? entry.dialectStatus : "unconverted";
    dialectDirty = !!entry.dialectDirty;
    originalRev = Math.max(0, parseInt(entry.originalRev,10) || 0);
    dialectRev = Math.max(0, parseInt(entry.dialectRev,10) || 0);
    dialectConvertedFromRev = Math.max(0, parseInt(entry.dialectConvertedFromRev,10) || 0);
    renderEditorView();
    applyText(String(editorView===EDITOR_VIEW_DIALECT ? dialectText : textInput.dataset.originalText), textState, true);
    showToast("已填入编辑框，请确认后生成");
  }
  function useContentEntry(entry, from){
    if (!csAlive() || !entry) return;
    saveDraftNow();                    // 先保存当前未保存修改，再打开另一条
    if (from === "drafts") {
      var full = null;
      try { full = CS.getDraft(entry.id); } catch (e) { full = null; }
      closeContentSheet();
      applyContentEntry(full || entry);
      scrollEditorIntoView();
      return;
    }
    closeContentSheet();
    applyContentEntry(entry);
    scrollEditorIntoView();
  }
  function scrollEditorIntoView(){
    try {
      textInput.scrollIntoView({ behavior: "smooth", block: "center" });
    } catch (e) {}
    setTimeout(function () { try { if (document.activeElement !== textInput) textInput.focus({ preventScroll: true }); } catch (e) {} }, 260);
  }
  function openContentSheet(tab){
    if (!contentSheet) return;
    sheetTab = tab || "favorites";
    if (contentTabs) {
      Array.prototype.forEach.call(contentTabs.querySelectorAll(".content-tab"), function (t) {
        var on = t.dataset && t.dataset.tab === sheetTab;
        t.classList.toggle("active", on);
        t.setAttribute("aria-selected", on ? "true" : "false");
      });
    }
    sheetOpen = true;
    contentSheet.hidden = false;
    renderContentList();
    document.documentElement.classList.add("content-sheet-open");
    try { requestAnimationFrame(function(){ contentSheet.classList.add("open"); }); } catch (e) { contentSheet.classList.add("open"); }
  }
  function closeContentSheet(){
    if (!contentSheet || contentSheet.hidden) return;
    sheetOpen = false;
    contentSheet.classList.remove("open");
    document.documentElement.classList.remove("content-sheet-open");
    setTimeout(function(){ if (!sheetOpen) contentSheet.hidden = true; }, 240);
  }
  function openNewSheet(){
    if (!newContentSheet) return;
    newContentSheet.hidden = false;
    document.documentElement.classList.add("content-sheet-open");
    try { requestAnimationFrame(function(){ newContentSheet.classList.add("open"); }); } catch (e) { newContentSheet.classList.add("open"); }
  }
  function closeNewSheet(){
    if (!newContentSheet || newContentSheet.hidden) return;
    newContentSheet.classList.remove("open");
    if (!sheetOpen) document.documentElement.classList.remove("content-sheet-open");
    setTimeout(function(){ if (!newContentSheet.classList.contains("open")) newContentSheet.hidden = true; }, 240);
  }

  /* -------- 再做一条 / 继续编辑 -------- */
  function keepTextAndStartNew(){
    if (!csAlive()) { closeNewSheet(); showToast("本机内容暂不可用"); return; }
    commitDraftToList();                       // 旧记录原样保留
    captureActiveView();
    var keepOriginal = textInput.dataset.originalText || "";
    var keepDialect = dialectText || "";
    var keepView = editorView;
    var created = CS.startNewDraft({
      keepText: true, text: keepOriginal, originalText: keepOriginal,
      dialectText: keepDialect, dialectStatus: dialectStatus, dialectDirty: dialectDirty,
      activeTextView: keepView, dialectConvertedFromRev: dialectConvertedFromRev,
      contentType: CONTENT_TYPE,
      characterId: (characterSelect && characterSelect.value) || "",
      voiceId: voiceSelect ? voiceSelect.value : "",
      voiceScope: voiceScopeSelect ? voiceScopeSelect.value : "standard",
      dialectId: dialectSelect ? dialectSelect.value : "",
      emotionId: current ? String(current.id) : ""
    });
    draftId = created ? created.id : "";
    // 新的一条：原文、方言稿与当前视图一起带过来（复制，不动旧记录）
    textInput.dataset.originalText = keepOriginal;
    dialectText = keepDialect;
    originalRev = 0; dialectRev = keepDialect ? 1 : 0;
    dialectConvertedFromRev = keepDialect ? 0 : 0;   // 复制过来的方言稿视为「对得上这份原文」
    editorView = keepView;
    textState = keepOriginal ? TEXT_EDITED : TEXT_UNTOUCHED;
    contentVersion++;
    savedContentVersion = -1; currentResultId = ""; resultStale = false;
    if (btnAgain) btnAgain.hidden = true;
    clearGenerated();
    if (editorView===EDITOR_VIEW_DIALECT && !dialectText) dialectText = keepDialect || keepOriginal;
    renderEditorView();
    saveDraftNow();
    closeNewSheet();
    scrollEditorIntoView();
    showToast("已开始新的一条");
  }
  function clearTextAndStartNew(){
    if (!csAlive()) { closeNewSheet(); return; }
    commitDraftToList();                       // 先完整保存当前内容
    var created = CS.startNewDraft({
      keepText: false, contentType: CONTENT_TYPE,
      characterId: (characterSelect && characterSelect.value) || "",
      voiceId: voiceSelect ? voiceSelect.value : "",
      voiceScope: voiceScopeSelect ? voiceScopeSelect.value : "standard",
      dialectId: dialectSelect ? dialectSelect.value : ""
    });
    draftId = created ? created.id : "";
    savedContentVersion = -1; currentResultId = ""; resultStale = false;
    if (btnAgain) btnAgain.hidden = true;
    hideUndoBar();
    // 清空重写：原文与方言稿一起清空，视图回到原文；旧内容已经在上面保存过
    textInput.dataset.originalText = "";
    dialectText = "";
    dialectStatus = "unconverted";
    dialectDirty = false;
    originalRev = 0; dialectRev = 0; dialectConvertedFromRev = 0;
    editorView = EDITOR_VIEW_ORIGINAL;
    applyText("", TEXT_UNTOUCHED);
    clearGenerated();
    closeNewSheet();
    scrollEditorIntoView();
    showToast("已新建空白一条");
  }
  function continueEditing(){
    if (resultStale) invalidateGeneratedResult();
    scrollEditorIntoView();
    showToast("继续编辑这条内容");

  function playAlphaVideo(delivery){
    if(!alphaVideo || !delivery) return false;
    // ---- 素材准入（2026-09-15 审计结论）------------------------------------
    // R2 上 19 条素材的 webHevc(.mov) 全部是**未抠像的绿幕源**：ffprobe 显示单轨
    // yuv420p、无 alpha 通道，逐帧采样绿色占比 82%–92%（manifest 里标注的
    // "alpha": true 与实物不符）。因此正式调用一律不再使用 delivery.hevc。
    // 已验收的正式交付只有两种：webVp9（透明）与 mobileFallback（黑底 MP4）。
    // 桌面端按 VP9 → 黑底 MP4；手机端按 黑底 MP4 → VP9；全部失败才走备用动画。
    var sources = VIDEO_IS_MOBILE
      ? [delivery.mobileFallback, delivery.vp9]
      : [delivery.vp9, delivery.mobileFallback];
    sources = sources.filter(function(u){ return !!u; });
    if(!sources.length){
      setStatus("当前情绪暂无浏览器可用透明视频，已切换备用动画", "err");
      return false;
    }
    var token = ++alphaVideoToken;
    var sourceIndex = 0;
    function fallbackCanvas(){
      if(token !== alphaVideoToken) return;
      alphaVideo.classList.remove("is-ready");
      alphaVideo.hidden = true;
      canvas.hidden = false;
      // 失败不隐藏：把真实原因留在控制台，页面上给统一提示
      if(failedSources.length) console.warn("[alpha-video] 全部交付源都不可用，已转备用动画", failedSources);
      if(current && current.sheetCount > 0){
        setStatus("当前浏览器透明视频不可用，已切换备用动画", "err");
        loadSheets();
      } else {
        setStatus("当前浏览器暂时无法播放该透明视频", "err");
      }
    }
    // 原子切换：先把媒体层收起（透明，但保留布局盒让浏览器继续解码），
    // 换源 → 等 loadeddata + 绿幕体检通过 → 再一次性淡入。中间态绝不会画出
    // poster / 旧一帧 / 缩略图 / 上一个使者的素材。
    var failedSources = [];
    function tryNextSource(){
      if(token !== alphaVideoToken) return;
      if(sourceIndex >= sources.length){ fallbackCanvas(); return; }
      var url = sources[sourceIndex++];
      canvas.hidden = true;
      alphaVideo.classList.remove("is-ready");
      alphaVideo.hidden = false;
      alphaVideo.onerror = null;
      alphaVideo.src = url;
      try { alphaVideo.load(); } catch(e) {}
      var revealed = false;
      var reveal = function(){
        if(revealed) return;
        if(token !== alphaVideoToken) return;   // 旧回调不许覆盖新素材
        revealed = true;
        alphaVideo.classList.add("is-ready");
      };
      // 绿幕/透明度体检：手机与桌面都做，任何绿幕源都不允许上台。
      var checkAlpha = function(){
        alphaVideo.removeEventListener("loadeddata", checkAlpha);
        if(token !== alphaVideoToken) return;
        try {
          var c=document.createElement("canvas"); c.width=8; c.height=8;
          var cx=c.getContext("2d"); cx.drawImage(alphaVideo,0,0,8,8);
          var d=cx.getImageData(0,0,8,8).data;
          var transparent=0, opaqueGreen=0;
          for(var i=0;i<d.length;i+=4){
            if(d[i+3] < 20) transparent++;
            else if(d[i+1] > d[i]+30 && d[i+1] > d[i+2]+30) opaqueGreen++;
          }
          if(transparent < 8 && opaqueGreen > 24){
            failedSources.push({ url: url, reason: "green-screen" });
            console.warn("[alpha-video] 该源是未抠像绿幕，已跳过", url);
            tryNextSource();
            return;
          }
        } catch(e) { /* 采样失败（跨域/解码差异）不阻断正常播放 */ }
        reveal();
      };
      alphaVideo.addEventListener("loadeddata", checkAlpha, {once:true});
      var pr = alphaVideo.play();
      if(pr && pr.catch) pr.catch(function(){});
      alphaVideo.onerror = function(){
        if(token !== alphaVideoToken) return;
        var code = alphaVideo.error ? alphaVideo.error.code : 0;
        failedSources.push({ url: url, reason: "media-error", code: code });
        console.warn("[alpha-video] 交付源加载失败 kind=media-error code=" + code, url);
        tryNextSource();
      };
    }
    tryNextSource();
    return true;
  }

  document.addEventListener("visibilitychange", function(){

    if(/\.(mp4|webm|mov|m4v)$/i.test(String(dir))){ dir = "mobile/" + id; }

  function ensureSheets(id, cb, errCb){
    var e = EMOTIONS.find(function(x){ return x.id === id; });
    // 防御：id 不属于当前使者的情绪表时（例如切换使者瞬间，旧的预加载队列还在跑），
    // 直接安静退出，不去拼一个不存在的素材路径，避免 404 与后台报错。
    if(!e){
      if(typeof errCb === "function") errCb();
      return;
    }
    var c = cache[id];
    if(c && c.state === "ready"){ cb(c.sheets); return; }
    if(!c){ c = { sheets:[], state:"idle", sheetState:[], waiting:[], errWaiting:[], done:0 }; cache[id]=c; }
    c.waiting.push(cb);
    if(errCb) c.errWaiting.push(errCb);
    if(c.state === "loading") return;

    // error 或 idle 都允许重新加载（用户点击可重试）
    c.state = "loading"; c.done = 0; c.sheets = []; c.sheetState = [];
    for(var i=0;i<e.sheetCount;i++){
      c.sheetState[i] = "loading";
      (function(i){
        var im = new Image();
        im.onload = function(){
          c.sheets[i] = im; c.sheetState[i] = "ready"; c.done++;
          if(c.done === e.sheetCount){ c.state = "ready"; flushSheets(c, true); }
        };
        im.onerror = function(){
          c.sheetState[i] = "error"; c.state = "error"; flushSheets(c, false);
        };
        im.src = sheetUrl(id, i);
      })(i);
    }
    clearTimeout(c.timer);
    c.timer = setTimeout(function(){ if(c.state === "loading"){ c.state = "error"; flushSheets(c, false); } }, 30000);
  }

  function flushSheets(c, ok){

    else { es.forEach(function(f){ f(); }); }
    renderPreloadDiag();
  }

  function keyboardScrollTop(){

  window.onNativeStatus = function(ev){

      else if(phase === "error"){ nativeReady=false; btnSendWeChat.disabled=true; btnSendWeChat.textContent="发给微信好友"; setStatus(ev.message || "视频准备失败，请重新生成后再试", "err"); document.documentElement.classList.add("show-save-fallback"); }
      else if(phase === "sharing"){ setStatus("正在打开系统分享…", ""); }

  function withTimeout(promise, ms, controller){
    return new Promise(function(resolve, reject){
      var t=setTimeout(function(){
        if(controller){ try { controller.abort(); } catch(e){} }
        reject(new Error("generate timeout"));
      }, ms);
      promise.then(function(v){ clearTimeout(t); resolve(v); }, function(e){ clearTimeout(t); reject(e); });
    });
  }

  function resetPreviewButton(){ btnPreviewVoice.disabled=false; btnPreviewVoice.textContent="🔊 试听"; }
  function stopPreviewAudio(){
    if(previewSource){
      try{ previewSource.onended=null; previewSource.stop(); }catch(e){}
      try{ previewSource.disconnect(); }catch(e){}
      previewSource=null;
    }
    if(previewAudio){
      try{ previewAudio.pause(); }catch(e){}
      previewAudio.onended=null; previewAudio.onerror=null;
      previewAudio.removeAttribute("src");
      try{ previewAudio.load(); }catch(e){}
      previewAudio=null;
    }
    if(previewHtmlAudio){
      try{ previewHtmlAudio.pause(); }catch(e){}
      previewHtmlAudio.onended=null; previewHtmlAudio.onerror=null;
      previewHtmlAudio.removeAttribute("src");
      try{ previewHtmlAudio.load(); }catch(e){}
      previewHtmlAudio.muted=false;
    }
    if(previewAudioUrl){ try{ URL.revokeObjectURL(previewAudioUrl); }catch(e){} previewAudioUrl=null; }
  }
  function invalidatePreviewToken(){
    previewReqId++;
    stopPreviewAudio();
    previewState="idle";
    ttsToken=null;
    resetPreviewButton();
  }
  function onPreviewAudioEnded(){
    stopPreviewAudio();
    previewState="idle";
    resetPreviewButton();
  }
  function previewVoice(){
    if(previewState==="playing"){ stopPreviewAudio(); previewState="idle"; resetPreviewButton(); return; }
    if(previewState==="loading") return;
    var text=effectiveSpeechText();
    if(!text){ showToast("请先输入或选择一句话"); return; }
    var myReq=++previewReqId;
    previewState="loading";
    btnPreviewVoice.disabled=true; btnPreviewVoice.textContent="生成语音…";

    if(isIOS){
      // iOS：点击手势内先用可复用的 HTMLAudioElement 做 muted 解锁（不播放可听内容），
      // 之后同一 element 收到真实 MP3 时才能被 iOS 允许播放。
      if(!previewHtmlAudio){ try{ previewHtmlAudio=new Audio(); }catch(e){ previewHtmlAudio=null; } }
      if(previewHtmlAudio){
        previewHtmlAudio.muted=true;
        previewHtmlAudio.src=SILENT_WAV;
        try{ previewHtmlAudio.play().catch(function(){}); }catch(e){}
      }
    } else {
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!previewAudioCtx && AC){ try{ previewAudioCtx=new AC(); }catch(e){ previewAudioCtx=null; } }
      if(previewAudioCtx && previewAudioCtx.state==="suspended"){ previewAudioCtx.resume().catch(function(){}); }
    }

    fetch(MAKE_SEND_API + "/tts", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ text:text, voiceId:voiceSelect.value, itemId:current ? current.item : "" }),
      cache:"no-store",
      mode:"cors"
    }).then(function(resp){
      if(myReq!==previewReqId) return null;
      var token=resp.headers.get("X-TTS-Token");
      if(!resp.ok){
        return resp.json().catch(function(){ return {}; }).then(function(d){ throw new Error((d&&d.message)||(d&&d.error)||("HTTP "+resp.status)); });
      }
      return resp.blob().then(function(blob){
        if(myReq!==previewReqId) return null;
        if(!blob || blob.size===0) throw new Error("empty audio");
        return { blob:blob, token:token };
      });
    }).then(async function(result){
      if(myReq!==previewReqId || !result) return;
      stopPreviewAudio();
      ttsToken=result.token || null;

      if(isIOS){
        if(!previewHtmlAudio){ try{ previewHtmlAudio=new Audio(); }catch(e){ previewHtmlAudio=null; } }
        previewAudioUrl=URL.createObjectURL(result.blob);
        previewHtmlAudio.src=previewAudioUrl;
        previewHtmlAudio.muted=false;
        previewHtmlAudio.onended=onPreviewAudioEnded;
        previewHtmlAudio.onerror=function(){ onPreviewAudioEnded(); };
        try{ previewHtmlAudio.load(); }catch(e){}
        previewState="playing";
        btnPreviewVoice.disabled=false; btnPreviewVoice.textContent="⏹ 停止";
        var pr=previewHtmlAudio.play();
        if(pr && pr.catch){ pr.catch(function(){ if(myReq!==previewReqId) return; if(previewHtmlAudio){ onPreviewAudioEnded(); } showToast("播放失败，请重试"); }); }
        return;
      }

      if(previewAudioCtx){
        try {
          if(previewAudioCtx.state !== "running"){
            await previewAudioCtx.resume().catch(function(){});
          }
          if(previewAudioCtx.state !== "running"){
            throw new Error("audio context not running");
          }
          var buf = await result.blob.arrayBuffer();
          if(myReq!==previewReqId) return;
          var audioBuffer = await new Promise(function(resolve, reject){
            previewAudioCtx.decodeAudioData(buf, resolve, reject);
          });
          if(myReq!==previewReqId) return;
          if(!audioBuffer) throw new Error("decode audio failed");
          var src=previewAudioCtx.createBufferSource();
          src.buffer=audioBuffer;
          src.connect(previewAudioCtx.destination);
          src.onended=function(){ if(previewSource===src){ previewSource=null; onPreviewAudioEnded(); } };
          previewSource=src;
          previewState="playing";
          btnPreviewVoice.disabled=false; btnPreviewVoice.textContent="⏹ 停止";
          src.start(0);
          return;
        } catch(e) {
          if(myReq!==previewReqId) return;
        }
      }

      // 非 iOS 兜底：无 AudioContext 或 AudioContext 播放失败时用 HTMLAudioElement
      previewAudioUrl=URL.createObjectURL(result.blob);
      previewAudio=new Audio(previewAudioUrl);
      previewAudio.onended=onPreviewAudioEnded;
      previewAudio.onerror=function(){ onPreviewAudioEnded(); };
      previewState="playing";
      btnPreviewVoice.disabled=false; btnPreviewVoice.textContent="⏹ 停止";
      var pr=previewAudio.play();
      if(pr && pr.catch){ pr.catch(function(){ if(previewAudio){ onPreviewAudioEnded(); showToast("播放失败，请重试"); } }); }
    }).catch(function(err){
      if(myReq!==previewReqId) return;
      stopPreviewAudio();
      previewState="idle";
      ttsToken=null;
      resetPreviewButton();
      showToast(err && err.message ? err.message : "试听失败，请重试");
    });
  }

  async function generateVideo(){
    if(window.__SITE_PAUSED__ === true){ showToast("服务暂时不可用，请稍后再试"); return; }
    if(isGenerating){
      showToast("视频正在生成，请稍候");
      return;
    }
    // 字幕与分享文案永远用「原文」；当前停在方言视图时也不能把方言稿当成字幕
    captureActiveView();
    var text=(textInput.dataset.originalText||"").trim();
    if(text && countChars(text) > 30){ showToast("文字较长，生成视频会相应更长。"); }

    cancelReason=null;
    var myToken=++genToken;
    isGenerating=true;
    genCount++;
    var tClick = performance.now();
    btnGenerate.textContent="正在生成…"; syncGenerateEnabled();
    var msgs=text ? ["正在生成你的情绪视频…","正在加入你的文字…","正在生成声音…","视频马上好了…"] : ["正在生成你的情绪视频…","正在编排动作与表情…","视频马上好了…"];
    var mi=0; setStatus(msgs[0]); setHint("");
    generatePhase="feedback-visible";
    lastTiming={ clickToFetchMs:"—", fetchMs:"—", blobMs:"—", totalMs:"—" };
    renderDiag();
    genTimerId=setInterval(function(){ mi=(mi+1)%msgs.length; setStatus(msgs[mi]); }, 2600);

    try{
      clearGenerated();
      setGenerationProgress("preparing", "准备中", text ? "正在准备文字与声音" : "正在准备情绪视频");
      await new Promise(function(resolve){
        requestAnimationFrame(function(){ setTimeout(resolve, 0); });
      });
      var tFetchStart = performance.now();
      lastTiming.clickToFetchMs=Math.round(tFetchStart-tClick);
      if(!BUILD_CONTRACT || !current){ throw new Error("production contract not ready"); }
      var speechText=text ? effectiveSpeechText() : "";
      if(!text){ ttsToken=null; speechText=""; }
      var url=MAKE_SEND_API + "/make-send?text=" + encodeURIComponent(text) + "&item=" + encodeURIComponent(current.item) + "&characterId=" + encodeURIComponent(current.characterId) + "&buildId=" + encodeURIComponent(BUILD_CONTRACT.buildId) + "&manifestVersion=" + encodeURIComponent(BUILD_CONTRACT.manifestVersion) + "&assetVersion=" + encodeURIComponent(current.assetVersion || "") + "&expectedMasterSHA256=" + encodeURIComponent(current.generationMasterSha256 || "") + "&voiceId=" + encodeURIComponent(voiceSelect.value) + (text && speechText && speechText!==text ? "&speechText=" + encodeURIComponent(speechText) : "") + (text && ttsToken ? "&ttsToken=" + encodeURIComponent(ttsToken) : "") + (isAppBridge ? "&app_bridge=1" : "") + "&async=1";
      activeController = typeof AbortController === "function" ? new AbortController() : null;
      generatePhase="request-sent";
      renderDiag();
      console.info("[send-test] request sent", { item:current.item, clickToFetchMs:lastTiming.clickToFetchMs });
      var request = fetch(url, { cache:"no-store", mode:"cors", signal:activeController ? activeController.signal : undefined });
      var resp=await withTimeout(request, GENERATE_TIMEOUT_MS, activeController);
      var tHeaders = performance.now();
      generatePhase="response-headers";
      if(!resp.ok){
        var errMsg=null;
        try {
          var errText=await withTimeout(resp.text(), 4000, activeController);
          try { var j=JSON.parse(errText); errMsg=(j && (j.message || j.error)) || null; } catch(e){ errMsg=errText ? errText.slice(0,120) : null; }
        } catch(e){ /* 错误响应体读取超时也直接按通用错误处理 */ }
        var err=new Error("HTTP "+resp.status);
        err.status=resp.status;
        if(errMsg){ err.backendMessage=errMsg; }
        throw err;
      }
      var jobData=null;
      try { jobData=await withTimeout(resp.json(), 4000, activeController); } catch(e){}
      if(!jobData || !jobData.job){ throw new Error("invalid job response"); }
      var job=jobData.job;
      var stageDelay = Math.max(0, 300 - (Date.now() - generationProgressStartedAt));
      if(text && !ttsToken){
        generationProgressTimer=setTimeout(function(){
          setGenerationProgress("voice", "生成声音", "正在生成语音与字幕");
          generationProgressTimer=setTimeout(function(){ setGenerationProgress("compose", "合成视频", "正在合成情绪视频"); }, 3500);
        }, stageDelay);
      } else {
        generationProgressTimer=setTimeout(function(){ setGenerationProgress("compose", "合成视频", "正在合成情绪视频"); }, stageDelay);
      }
      // 长文本异步生成：后端立即返回 202 {job}，前端轮询 /make-send/result 拿 videoPath，
      // 避免单次长连接等待超过网络/代理容忍窗口而被切断。
      var videoPath="";
      var pollDeadline = Date.now() + 150000;
      generatePhase="polling";
      renderDiag();
      while(true){
        if(myToken !== genToken || cancelReason === "user" || !isGenerating){ return; }
        if(Date.now() > pollDeadline){
          if(activeController){ try{ activeController.abort(); }catch(e){} }
          throw new Error("generate timeout");
        }
        var pollUrl=MAKE_SEND_API + "/make-send/result?job=" + encodeURIComponent(job);
        var pollResp=await withTimeout(fetch(pollUrl, { cache:"no-store", mode:"cors" }), 20000, activeController);
        var pollJson=null;
        try { pollJson=await pollResp.json(); } catch(e){}
        if(!pollResp.ok || !pollJson){
          var perr=new Error("HTTP "+(pollResp ? pollResp.status : "?"));
          if(pollJson && (pollJson.error || pollJson.message)){ perr.backendMessage=pollJson.error || pollJson.message; }
          throw perr;
        }
        if(pollJson.status === "done" && pollJson.videoPath){ videoPath=pollJson.videoPath; break; }
        if(pollJson.status === "error"){
          var e3=new Error(pollJson.error || "生成失败");
          e3.backendMessage=pollJson.error || "生成失败";
          throw e3;
        }
        if(pollJson.status === "busy"){
          var e4=new Error(pollJson.error || "服务繁忙，请稍后重试");
          e4.backendMessage=pollJson.error || "服务繁忙，请稍后重试";
          throw e4;
        }
        await new Promise(function(res){ setTimeout(res, 2000); });
        if(myToken !== genToken || cancelReason === "user" || !isGenerating){ return; }
      }
      var vresp=await withTimeout(fetch(MAKE_SEND_API + videoPath, { cache:"no-store", mode:"cors", signal:activeController ? activeController.signal : undefined }), BLOB_TIMEOUT_MS, activeController);

      var tBlob = performance.now();
      var blob=await withTimeout(vresp.blob(), BLOB_TIMEOUT_MS, activeController);
      if(!blob || blob.size===0) throw new Error("empty blob");
      var file=new File([blob], EXPORT_FILE_NAME, { type:"video/mp4" });
      lastBlob=blob; lastFile=file;
      lastUrl=URL.createObjectURL(blob);
      videoEl.src=lastUrl;
      videoEl.hidden=false;
      if(btnSound){ btnSound.hidden=false; syncSoundBtn(); }
      videoEl.play().catch(function(){});
      // 首帧设为 poster：个别 WebView 拦截自动播放时，预览区仍显示视频首帧而非空白
      videoEl.addEventListener("loadeddata", function onFirstFrame(){
        videoEl.removeEventListener("loadeddata", onFirstFrame);
        try {
          var fc=document.createElement("canvas");
          fc.width=videoEl.videoWidth; fc.height=videoEl.videoHeight;
          fc.getContext("2d").drawImage(videoEl, 0, 0);

        } catch(e){}
      });
      // poster 仅作兜底：自动播放被拦截时，首次任意交互（或点击视频）即恢复真实视频播放
      var ensurePlay = function(){
        document.removeEventListener("touchstart", ensurePlay);
        document.removeEventListener("click", ensurePlay);
        try { if(videoEl.paused) videoEl.play().catch(function(){}); } catch(e){}
      };
      document.addEventListener("touchstart", ensurePlay, { passive:true });
      document.addEventListener("click", ensurePlay);
      videoEl.addEventListener("click", function(){ try { videoEl.play().catch(function(){}); } catch(e){} });
      var tDone = performance.now();
      lastTiming = { clickToFetchMs: Math.round(tFetchStart-tClick), fetchMs: Math.round(tHeaders-tFetchStart), blobMs: Math.round(tBlob-tHeaders), totalMs: Math.round(tDone-tClick) };
      generatePhase="success";
      if(generationProgressTimer){ clearTimeout(generationProgressTimer); generationProgressTimer=null; }
      setGenerationProgress("complete", "完成", "视频已生成");
      generationProgressTimer=setTimeout(function(){ if(generationProgress) generationProgress.hidden=true; generationProgressTimer=null; }, 1600);
      if(isAppBridge){ nativeVideoPath = /^\/app-video\/[A-Za-z0-9_-]{20,128}\.mp4$/.test(videoPath) ? videoPath : ""; }
      setStatus("视频生成成功", "ok");
      document.documentElement.classList.add("state-done");
      var canShareFile = false;
      try { canShareFile = !!(navigator.canShare && navigator.canShare({files:[file]})); } catch(e) { canShareFile = false; }
      var shareHint;
      if(isIOS && !isWeChat && canShareFile){ shareHint = "点击“发给TA”，即可打开系统分享面板"; }
      else if(isIOS){ shareHint = "打开后，点击右上角‘…’即可分享"; }
      else if(isWeChat){ shareHint = "请在浏览器中打开后发送视频"; }
      else if(isAndroid){ shareHint = "点击“发给TA”，选择微信发送。"; }
      else { shareHint = "点击“发给TA”，可选择微信或其他应用。"; }
      setHint(shareHint);
      btnReEdit.hidden=false; btnHome.hidden=false; if(btnAgain) btnAgain.hidden=true;   // 「再做一条」在分享返回后出现
      if(isAppBridge){
        setHint("");
        btnSendWeChat.hidden=false; btnSendWeChat.disabled=true; btnSendWeChat.textContent="发给微信好友";
        if(nativeVideoPath){
          handoffToNative();
        } else {
          setStatus("视频已生成，但无法准备发送，请保存后从微信发送。", "err");
          document.documentElement.classList.add("show-save-fallback");
        }
      }
      btnSend.disabled=false;
      if(!isWeChat && !isAppBridge){
        if(canShareFile){
          setHint("点击“发给TA”，可选择微信或其他应用。");
        } else {
          btnSave.hidden=false;
          setHint("当前浏览器不能直接分享，点击“发给TA”将保存视频，再打开微信发送。");
        }
      }
      // 用户内容系统 V1：生成结果与当前编辑内容版本绑定，并写入「最近使用」
      bindGeneratedResult();
      var usedEntry = currentDraftPayload();
      usedEntry.generateResultId = currentResultId;
      usedEntry.source = "new";
      try { CS.addRecent(usedEntry); } catch(e) {}
      syncPrimaryActions();
    } catch(err){
      if(myToken !== genToken) return;
      var timedOut = !!(activeController && activeController.signal.aborted && cancelReason !== "user");
      console.error("generate error:", err);
      generatePhase = timedOut ? "timeout" : "error";
      if(cancelReason !== "user"){
        if(generationProgressTimer){ clearTimeout(generationProgressTimer); generationProgressTimer=null; }
        setGenerationProgress("failed", "失败", timedOut ? "生成超时，请重试" : "生成失败，请重试");
      }
      if(cancelReason === "user"){
        // 用户主动修改文字/切换情绪：静默取消，不弹错误
      } else if(timedOut){
        setStatus("生成时间有点久，请再试一次。", "err");
        showToast("生成时间有点久，请再试一次。");
      } else if(err.status === 429 || (err.backendMessage && /server\s*busy/i.test(String(err.backendMessage)))){
        setStatus("同时生成的视频有点多，请稍等几秒再试", "err");
        showToast("同时生成的视频有点多，请稍等几秒再试");
      } else if(err && err.backendMessage){
        setStatus(err.backendMessage, "err");
        showToast(err.backendMessage);
      } else {
        setStatus("视频生成失败，请重试", "err");
        showToast("视频生成失败，请重试");
      }
    } finally {
      if(myToken !== genToken) return;
      resetGenerateState();
    }
  }

  function openVideo(){
    if(!lastUrl){ showToast("请先生成视频"); return; }
    videoEl.hidden=false; videoEl.play && videoEl.play().catch(function(){});
    setHint("可直接在上方播放查看；如需发送，请保存到手机后从微信选择该视频。");
  }

  function downloadBlob(blob, name){
    var u=URL.createObjectURL(blob);
    var a=document.createElement("a"); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000);
  }

  function saveVideo(){
    if(!lastBlob){ showToast("请先生成视频"); return; }
    downloadBlob(lastBlob, EXPORT_FILE_NAME);
    if(isIOS){
      setStatus("");
      setHint("打开后，点击右上角‘…’即可分享");
    } else {
      setStatus("视频已保存", "ok");
      setHint("已保存到手机；若找不到，可在浏览器下载记录中打开。");
    }
  }

  function sendVideo(){
    if(!lastFile){ showToast("请先生成视频"); return; }
    // 结果已过期（生成后又改过文字 / 使者 / 情绪 / 声音）：不允许把旧视频当成当前内容发送
    if(resultStale){
      showToast("内容已修改，请先重新生成");
      setHint("内容已修改，请先点击“重新生成 →”。");
      syncPrimaryActions();
      return;
    }
    var keepResultPage = function(){
      // 无论分享完成、取消还是失败：不清空内容、不跳回空白编辑页，
      // 继续显示「继续编辑」与「再做一条」。
      if(btnReEdit) btnReEdit.hidden = false;
      if(btnAgain) btnAgain.hidden = false;
      syncPrimaryActions();
    };
    if(navigator.canShare && navigator.canShare({files:[lastFile]})){
      if(isAndroid) setStatus("正在打开系统分享…");
      // 先把「继续编辑 / 再做一条」显示出来：即使系统分享面板的 Promise 没有回调
      // （部分 iPhone / 微信 / 浏览器在取消分享时不会 resolve），返回页面也一定有这两个入口。
      keepResultPage();
      navigator.share({ files:[lastFile], title:"心意表达", text:textInput.value }).then(function(){
        setStatus("已调起系统分享", "ok");
        keepResultPage();
      }).catch(function(e){
        console.error("share error:", e);
        if(isAndroid && e && e.name === "AbortError"){
          setStatus("视频已生成", "ok");
          setHint("已取消发送，可再次点击“发给TA”。");
        } else if(isIOS && e && e.name === "AbortError"){
          setStatus("视频已生成", "ok");
          setHint("已取消分享，可再次点击“发给TA”。");
        } else {
          setStatus("分享失败", "err");
          setHint("分享没有完成，视频与文字都还在，可再次点击“发给TA”。");
        }
        keepResultPage();
      });
    } else {
      downloadBlob(lastBlob, EXPORT_FILE_NAME);
      setStatus("视频已保存，请从微信发送", "ok");
      setHint("当前浏览器不能直接分享，视频已保存；请打开微信发送。");
      keepResultPage();
    }
  }

  btnSuggest.addEventListener("click", function(){
    if(suggestBox.hidden){
      renderSuggest();          // 每次打开都重新渲染，让爱心与收藏列表保持一致
      suggestBox.hidden = false;
    } else {
      suggestBox.hidden = true;
    }
    syncGenerateEnabled();
  });

  btnPreviewVoice.addEventListener("click", previewVoice);
  btnGenerate.addEventListener("click", generateVideo);
  btnOpen.addEventListener("click", openVideo);
  function syncSoundBtn(){
    if(!btnSound) return;
    btnSound.textContent = videoEl.muted ? "🔇" : "🔊";
  }
  if(btnSound){
    btnSound.addEventListener("click", function(){
      videoEl.muted = !videoEl.muted;
      syncSoundBtn();
      try { if(videoEl.paused) videoEl.play().catch(function(){}); } catch(e){}
    });
  }
  btnSave.addEventListener("click", saveVideo);
  btnSend.addEventListener("click", sendVideo);
  btnReEdit.addEventListener("click", reEdit);
  function backHomeOrIndex(){
    if (fwdFromHome) {
      try { if (window.history && window.history.length > 1) { window.history.back(); return; } } catch (e) {}
    }
    location.href = "index.html";
  }
  btnHome.addEventListener("click", backHomeOrIndex);
  var backHomeLink = document.querySelector(".back-home");
  if (backHomeLink && fwdFromHome) {
    backHomeLink.addEventListener("click", function (ev) {
      try { if (window.history && window.history.length > 1) { ev.preventDefault(); window.history.back(); } } catch (e) {}
    });
  }
  btnSendWeChat.addEventListener("click", function(){
    if(!nativeReady){ setStatus("视频正在准备，请稍候…", ""); return; }
    try { window.AndroidShare.sharePreparedVideo(); } catch(err){ setStatus("无法打开系统分享，请重试", "err"); }
    renderBridgeDiag();
  });

  if (debugMode) {
    document.addEventListener("click", function(e){
      var el = document.elementFromPoint(e.clientX, e.clientY);
      var desc = el ? (el.tagName + "." + (typeof el.className === "string" ? el.className : "").split(" ")[0]) : "null";
      if(tapDiagEl) tapDiagEl.innerHTML = "点击命中: " + desc;
    }, true);
  }


  refreshUI();
  loadEmotionVisual();
  renderDiag();
  renderBridgeDiag();
  renderPreloadDiag();
  updateCharCount();
  syncGenerateEnabled();
};

if (window.__MAIN_PENDING__) {
  window.__MAIN_PENDING__ = false;
  window.__MAIN__();
}
</script>
<script>
// 诊断模式（仅 ?perf=1）：在页面右下角显示各阶段耗时（相对导航开始，毫秒）。
// 用于真机定位“切换慢”的时间去向：HTML解析/初始化/兔子素材解码。
(function () {
  if (new URLSearchParams(location.search).get("perf") !== "1") return;
  var navT = (window.performance && performance.timing && performance.timing.navigationStart) ? performance.timing.navigationStart : Date.now();
  function now() {
    return Math.round((window.performance && performance.now) ? performance.now() : (Date.now() - navT));
  }
  function show(html) {
    var bar = document.getElementById("perfBar");
    if (!bar) {
      bar = document.createElement("div");
      bar.id = "perfBar";
      bar.style.cssText = "position:fixed;right:8px;bottom:120px;z-index:99999;background:rgba(0,0,0,.82);color:#7CFFB2;font:11px/1.6 monospace;padding:8px 10px;border-radius:10px;white-space:pre;max-width:78vw;pointer-events:none;";
      document.body.appendChild(bar);
    }
    bar.innerHTML = html;
  }
  var R = { dcl: "-", load: "-", init: "-", rabbit: "-" };
  document.addEventListener("DOMContentLoaded", function () { R.dcl = now(); });
  window.addEventListener("load", function () { R.load = now(); });
  var tries = 0;
  function poll() {
    tries++;
    if (R.init === "-" && document.querySelectorAll(".emotion").length >= 3) R.init = now();
    var cv = document.getElementById("stage");
    var painted = false;
    try { var c = cv && cv.getContext ? cv.getContext("2d") : null; if (c) { var d = c.getImageData(200, 200, 1, 1).data; painted = d[3] !== 0; } } catch (e) {}
    if (R.rabbit === "-" && painted) R.rabbit = now();
    show("页面解析/JS执行  → DOMContentLoaded: " + R.dcl + "ms\nload 事件: " + R.load + "ms\n情绪按钮渲染(初始化完成): " + R.init + "ms\n兔子首帧绘制(素材解码完成): " + R.rabbit + "ms\n网络传输(HTML+JS+素材): 另计");
    if (R.rabbit !== "-" || tries > 400) { show("perf 完成\n→ DOMContentLoaded: " + R.dcl + "ms\n→ load: " + R.load + "ms\n→ 初始化(情绪按钮): " + R.init + "ms\n→ 兔子首帧: " + R.rabbit + "ms"); return; }
    setTimeout(poll, 50);
  }
  setTimeout(poll, 100);
  setTimeout(function () { show("perf(15s超时)\n→ DOMContentLoaded: " + R.dcl + "ms\n→ load: " + R.load + "ms\n→ 初始化: " + R.init + "ms\n→ 兔子首帧: " + R.rabbit + "ms"); }, 15000);
})();
</script>
