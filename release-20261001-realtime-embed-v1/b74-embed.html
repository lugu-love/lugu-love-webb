<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020407">
<title>面对面实时对话</title>
<link rel="stylesheet" href="https://candidate.suomaanjia.cn:8443/lugu-b74/candidate.css?v=12">
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#020407}
#b74-embed-start{position:fixed;z-index:99999;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);transform:translateX(-50%);min-height:50px;padding:0 24px;border-radius:999px;border:1px solid rgba(255,235,195,.36);background:linear-gradient(135deg,#8f76ff,#be67ff);color:#fff;font:700 16px/1 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;box-shadow:0 12px 36px rgba(125,90,255,.4)}
#b74-embed-start[hidden]{display:none}
</style>
</head>
<body>
<button id="b74-embed-start" type="button">开始面对面对话</button>
<script>
window.__B74_BASE_PATH = "https://candidate.suomaanjia.cn:8443/lugu-b74";
window.__B74_WS_URL = "wss://candidate.suomaanjia.cn:8443/lugu-b74/ws/doubao";
window.__B74_REGISTRY_URL = "./characters.v1.json";
</script>
<script type="module">
import "./b74-candidate.js?v=1";
const button = document.getElementById("b74-embed-start");
let starting = false;
async function start() {
  if (starting) return;
  starting = true;
  button.hidden = true;
  await (window.__b74Ready || Promise.resolve());
  const ok = await window.__b74OpenFaceToFace?.();
  if (!ok) {
    button.hidden = false;
    starting = false;
  }
}
button.addEventListener("click", start);
if (new URLSearchParams(location.search).get("autostart") === "1") {
  await (window.__b74Ready || Promise.resolve());
  setTimeout(start, 350);
}
</script>
</body>
</html>
