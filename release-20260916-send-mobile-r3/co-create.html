<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>事业共创</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    background: #020407;
    color: #fff;
    font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .icon { font-size: 44px; line-height: 1; margin-bottom: 18px; }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: .08em; margin-bottom: 14px; }
  .slogan { font-size: 14px; letter-spacing: .2em; color: rgba(255, 214, 140, .95); margin-bottom: 8px; }
  .note { font-size: 12px; letter-spacing: .04em; color: rgba(255, 255, 255, .55); margin-bottom: 36px; }
  .back {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 16px;
    border: 1px solid rgba(255, 255, 255, .24);
    border-radius: 12px;
    background: rgba(255, 255, 255, .08);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    color: #fff; text-decoration: none; font-size: 13px;
  }
  .back:active { transform: scale(.96); }
</style>
</head>
<body>
  <div class="icon" aria-hidden="true">🤝</div>
  <h1>事业共创</h1>
  <p class="slogan">共建 · 共享 · 共赢</p>
  <p class="note">更多内容正在建设中</p>
  <a class="back" href="index.html">← 返回地球</a>
</body>
</html>
